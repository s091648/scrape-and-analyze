# docker-compose.yml
#
# 預設 (docker compose up) 啟動的服務：
#   postgres, redis, pgadmin, redisinsight, backend, frontend, fastembed, chatbot_plugin
#
# 一次性工具服務 (profile: tools)，不會被 docker compose up 帶起：
#   app, test_service, job_service, frontend_prod
#   使用方式：
#     docker compose run --rm job_service make migrate
#     docker compose run --rm test_service pytest src/tests/unit/
#     docker compose --profile tools up -d app   # 需要互動式 shell 時
#     docker compose --profile tools up --build frontend_prod   # production build + next start，量測真實 LCP/Lighthouse 用

services:
  # Fastembed embedding service — SPLADE 模型集中在此，scraper 與 chatbot-plugin 共用
  fastembed:
    build:
      context: .
      dockerfile: fastembed/Dockerfile.dev
    volumes:
      - ./fastembed/src:/app/src
    env_file:
      - .env
    # init: true — runs tini as PID 1 so orphaned/zombie child processes get reaped
    # (defense in depth; see the runaway-reload-loop OOM incident this was added after).
    # mem_limit — contains any single container's blast radius to itself instead of
    # starving the whole Docker VM (previously unbounded; every service below gets one
    # for the same reason). Starting point, not a measured ceiling — raise it if a
    # service gets OOM-killed under genuine load rather than a bug.
    init: true
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s  # SPLADE 模型載入需要時間

  # Scraper / Analyzer — 一次性工具容器，需加 --profile tools 才會啟動
  app:
    profiles:
      - tools
    build:
      context: .
      dockerfile: src/Dockerfile.dev
    image: scrape-analyzer-src-tools  # shared with job_service/test_service — same Dockerfile, built once
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./shared:/app/shared
      - ./pytest.ini:/app/pytest.ini
      - ./.coveragerc:/app/.coveragerc
      - fastembed_cache:/app/.fastembed_cache
      # LOCAL DEV ONLY — testing unreleased chatbot-plugin-sdk changes before a tagged
      # release. Remove once done (git checkout -- docker-compose.yml), or `uv pip
      # install -e /opt/chatbot-plugin-sdk` inside a `docker compose run` invocation
      # to override the image's git-pinned install for that one container.
      - ../chatbot-plugin-sdk:/opt/chatbot-plugin-sdk
    env_file:
      - .env
    init: true
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sleep infinity
    stdin_open: true
    tty: true

  # FastAPI backend — serves the REST API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
      args:
        MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
    volumes:
      - ./src:/app/src       # live-reload model changes
      - ./backend:/app/backend  # live-reload API changes
      - ./models:/app/models      # live-reload DB model changes
      - ./shared:/app/shared
    ports:
      - "8000:8000"
    env_file:
      - .env
    init: true
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # preserve installed modules
      - playwright_cache:/root/.cache/ms-playwright  # persist browser binaries
    ports:
      - "3000:3000"
    env_file:
      - .env
    init: true
    mem_limit: 2g
    command: npx next dev

  # Frontend, production build — runs the actual multi-stage frontend/Dockerfile
  # (npm run build + next start), not the dev server. No source bind-mount: this is
  # a real, freshly-built image, so it reflects production optimizations (minification,
  # RSC compilation, no HMR overhead) that `frontend`/Dockerfile.dev never applies.
  # Not started by `docker compose up` — opt in with --profile tools. Use this (not the
  # dev `frontend` service) whenever measuring real LCP/Web Vitals or running Lighthouse;
  # dev-mode numbers are not representative (see specs/020-redis-caching-layer/quickstart.md).
  frontend_prod:
    profiles:
      - tools
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GITHUB_PACKAGE_TOKEN: ${GITHUB_PACKAGE_TOKEN}
    ports:
      - "3001:3000"
    env_file:
      - .env
    init: true
    mem_limit: 1g
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # 020-redis-caching-layer Post-Ship Addendum: bounds memory + evicts only TTL'd keys
    # (cache blobs, rate-limit counters, view-dedup keys) under pressure — never the
    # durable view:{article_id} write-behind buffer or cache:v:{namespace} version
    # counters, which are intentionally left without a TTL (see research.md). This
    # only covers local dev/test — production's Railway-hosted redis is a standing
    # service outside this repo's deploy pipeline and needs the equivalent set via its
    # own Start Command (see specs/020-redis-caching-layer/research.md, T062a).
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    init: true
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./migrations:/docker-entrypoint-initdb.d
    init: true
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    init: true
    mem_limit: 512m

  redisinsight:
    image: redis/redisinsight:latest
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"  # skip the EULA prompt on first launch
      # Pre-wires a connection to the `redis` service above so it shows up ready-to-use.
      RI_REDIS_HOST0: redis
      RI_REDIS_PORT0: 6379
      RI_REDIS_ALIAS0: scrape-analyzer
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    init: true
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy

  # Test service — 一次性工具容器，需加 --profile tools 才會啟動
  test_service:
    profiles:
      - tools
    build:
      context: .
      dockerfile: src/Dockerfile.dev
    image: scrape-analyzer-src-tools  # shared with app/job_service — same Dockerfile, built once
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./shared:/app/shared
      - ./scripts:/app/scripts
      - ./backend:/app/backend
      - ./pytest.ini:/app/pytest.ini
      - ./.coveragerc:/app/.coveragerc
    env_file:
      - .env
    init: true
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # no command; `docker compose run` will supply the test command

  # Chatbot Plugin — OpenAI-compatible RAG chat service
  chatbot_plugin:
    build:
      context: ./chatbot-plugin
      dockerfile: Dockerfile.dev
    volumes:
      - ./chatbot-plugin/src:/app/src
      - chatbot_fastembed_cache:/app/.fastembed_cache
      # LOCAL DEV ONLY — see the matching comment on the `app` service's volumes.
      - ../chatbot-plugin-sdk:/opt/chatbot-plugin-sdk
    ports:
      - "8001:8000"
    env_file:
      - .env
    init: true
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      fastembed:
        condition: service_healthy
    # LOCAL DEV ONLY — installs the mounted local chatbot-plugin-sdk in editable mode
    # before starting, overriding the image's git-pinned install. Editable install +
    # --reload means later SDK source edits apply without restarting this container.
    # Revert to the default Dockerfile CMD (remove this override) once done testing.
    command: sh -c "uv pip install -e /opt/chatbot-plugin-sdk && uvicorn chatbot_plugin.main:app --host 0.0.0.0 --port ${PORT:-8000} --reload"

  # Job service — 一次性工具容器，需加 --profile tools 才會啟動
  job_service:
    profiles:
      - tools
    build:
      context: .
      dockerfile: src/Dockerfile.dev
    image: scrape-analyzer-src-tools  # shared with app/test_service — same Dockerfile, built once
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./shared:/app/shared
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./backend:/app/backend   # alembic/env.py 需要 import backend models
      - ./scripts:/app/scripts
      - ./db_dumps:/app/db_dumps # persistent dump storage (gitignored)
      # scripts/generate_terraform_docs.py (make uml-terraform-docs) statically
      # parses infra/terraform/railway/*.tf (the flat root — every <svc>.tf plus
      # shared.tf / github-ci.tf). Mount that dir read-only, but shadow the
      # secret-bearing paths: the higher-privilege terraform credentials
      # (account-level RAILWAY_TOKEN / TF_API_TOKEN / TF_GITHUB_TOKEN in .env, and
      # secrets/*.tfvars) must never enter an app container. The generator reads
      # only *.tf, never these — the empty overlays don't affect it.
      - ./infra/terraform/railway:/app/infra/terraform/railway:ro
      - /dev/null:/app/infra/terraform/railway/.env:ro
      - /app/infra/terraform/railway/secrets
      - /app/infra/terraform/railway/.terraform
      - fastembed_cache:/app/.fastembed_cache
    env_file:
      - .env
    init: true
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
    # no command; `docker compose run` will supply the script to run

volumes:
  postgres_data:
  pgadmin_data:
  redisinsight_data:
  frontend_node_modules:
  playwright_cache:
  fastembed_cache:
  chatbot_fastembed_cache:
