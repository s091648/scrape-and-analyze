# docker-compose.yml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
    environment:
      DATABASE_URL: postgresql://digital_twins:digital_twins@postgres:5432/digital_twins
      LLM_API_KEY: ${LLM_API_KEY:-test-key}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity
    stdin_open: true
    tty: true

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: digital_twins
      POSTGRES_PASSWORD: digital_twins
      POSTGRES_DB: digital_twins
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_twins"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
