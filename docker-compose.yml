# docker-compose.yml
services:
  # Scraper / Analyzer — runs src/ code and Alembic migrations
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./backend:/app/backend   # needed so alembic/env.py can import backend models
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./requirements.txt:/app/requirements.txt
    environment:
      DATABASE_URL: postgresql://digital_twins:digital_twins@postgres:5432/digital_twins
      LLM_API_KEY: ${LLM_API_KEY:-test-key}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity
    stdin_open: true
    tty: true

  # FastAPI backend — serves the REST API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./src:/app/src       # live-reload model changes
      - ./backend:/app/backend  # live-reload API changes
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://digital_twins:digital_twins@postgres:5432/digital_twins
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # preserve installed modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
    command: npm run dev

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: digital_twins
      POSTGRES_PASSWORD: digital_twins
      POSTGRES_DB: digital_twins
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_twins"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
