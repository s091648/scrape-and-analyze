# docker-compose.yml
services:
  # Scraper / Analyzer — runs src/ code and unit tests
  app:
    build:
      context: .
      dockerfile: src/Dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./pytest.ini:/app/pytest.ini
      - ./providers.toml:/app/providers.toml
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity
    stdin_open: true
    tty: true

  # FastAPI backend — serves the REST API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    volumes:
      - ./src:/app/src       # live-reload model changes
      - ./backend:/app/backend  # live-reload API changes
      - ./models:/app/models      # live-reload DB model changes
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # preserve installed modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: npx next dev

  postgres:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Test service - 一次性任務：跑單元/整合測試，包含所有 mounted 目錄
  test_service:
    build:
      context: .
      dockerfile: src/Dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./backend:/app/backend
      - ./pytest.ini:/app/pytest.ini
      - ./providers.toml:/app/providers.toml
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # no command; `docker compose run` will supply the test command

  # Job service - 一次性任務：migration、db dump/sync、backfill、scrape
  job_service:
    build:
      context: .
      dockerfile: src/Dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./backend:/app/backend   # alembic/env.py 需要 import backend models
      - ./scripts:/app/scripts
      - ./db_dumps:/app/db_dumps # persistent dump storage (gitignored)
      - ./providers.toml:/app/providers.toml
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # no command; `docker compose run` will supply the script to run

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
