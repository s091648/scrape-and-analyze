# weekly-report — Monday weekly-report generation (summary + image pipeline).
# Shares src/ code + src/Dockerfile with scrape-and-analyze; a distinct Railway
# service via its own startCommand + UV_GROUP.
#
# ── Railway service setting (ONE-TIME, manual) ───────────────────────────────
# Config File Path → /src/railway-weekly-report.toml
# (see specs/025-iac-provisioning/plan.md "Revision 3")
#
# UV_GROUP ("llm http-clients") is a Terraform-managed service variable —
# infra/terraform/railway/weekly-report.tf (var.uv_group_weekly_report). It is
# injected into the Dockerfile's `ARG UV_GROUP` at build time by Railway.
#
# No CLI arguments: --topic-id / --week-start are for manual local runs only; the
# cron invocation defaults to all active topics and last week's Monday.

[build]
builder        = "dockerfile"
dockerfilePath = "src/Dockerfile"

[deploy]
startCommand      = "/app/.venv/bin/python -m src.entrypoints.cli.weekly_report"
cronSchedule      = "0 0 * * 1"
restartPolicyType = "never"
