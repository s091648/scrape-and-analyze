# Worker service (scraper/analyzer cron jobs)
# Railway Root Directory: / (repo root)
#
# All three src/ services below share this one build (dockerfilePath = src/Dockerfile)
# but install a different subset of dependency-groups via the UV_GROUPS build ARG —
# Railway auto-passes a same-named service variable into Dockerfile ARGs at build
# time, so set UV_GROUPS as a plain service Variable (not here) per service.
# See pyproject.toml [dependency-groups] for what each group contains/why they're split.
#
# Railway Dashboard must set per-service overrides:
#   worker         → Dockerfile Path: src/Dockerfile
#                    Start Command:   (empty — use Dockerfile CMD: /app/.venv/bin/python -m src.entrypoints.cli.main)
#                    Restart Policy:  never
#                    UV_GROUPS:       (unset — Dockerfile default is "scraper llm http-clients")
#   weekly-report  → Config File Path: src/railway.toml (reuses this same build)
#                    Start Command:   /app/.venv/bin/python -m src.entrypoints.cli.weekly_report
#                    Cron Schedule:   0 8 * * 1  (every Monday, 08:00 UTC)
#                    Restart Policy:  never
#                    UV_GROUPS:       "llm http-clients"
#                    No arguments needed — --topic-id / --week-start are for manual
#                    local runs only; the cron invocation defaults to all active
#                    topics and last week's Monday.
#   refresh-metrics → Config File Path: src/railway.toml (reuses this same build)
#                    Start Command:   /app/.venv/bin/python -m src.entrypoints.cli.refresh_metrics
#                    Cron Schedule:   0 3 * * *  (daily, 03:00 UTC)
#                    Restart Policy:  never
#                    UV_GROUPS:       "http-clients metrics"
#                    Independent of weekly-report and of the backend's view_count
#                    Redis flush — keeps citation_count (and future catalog metrics)
#                    fresh for previously-scraped articles. See research.md §9b, §9f
#                    in specs/014-article-recommendation-weekly-report/.
#   dedup-reconcile → Config File Path: src/railway.toml (reuses this same build)
#                    Start Command:   /app/.venv/bin/python -m src.entrypoints.cli.dedup_reconcile
#                    Cron Schedule:   0 4 * * *  (daily, 04:00 UTC — after refresh-metrics)
#                    Restart Policy:  never
#                    UV_GROUPS:       "http-clients"
#                    Detects OpenAlex works that were deduped after we'd already
#                    scraped both sides of a duplicate, and merges them by
#                    tombstoning the loser via `articles.merged_into_id` —
#                    never deletes a row (see 25_add_article_merge_tombstone
#                    migration for why).
#   backend        → Dockerfile Path: backend/Dockerfile
#                    Start Command:   (empty — use Dockerfile CMD)
#                    Restart Policy:  on_failure

[build]
builder = "dockerfile"
dockerfilePath = "src/Dockerfile"
