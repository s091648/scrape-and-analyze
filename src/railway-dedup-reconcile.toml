# dedup-reconcile — daily cron (after refresh-metrics). Detects OpenAlex works
# deduped after we'd already scraped both sides of a duplicate and merges them by
# tombstoning the loser via articles.merged_into_id — never deletes a row.
# Shares src/ code + src/Dockerfile with scrape-and-analyze.
#
# ── Railway service setting (ONE-TIME, manual) ───────────────────────────────
# Config File Path → /src/railway-dedup-reconcile.toml
# (see specs/025-iac-provisioning/plan.md "Revision 3")
#
# UV_GROUP ("http-clients") is a Terraform-managed service variable —
# infra/terraform/railway/dedup-reconcile.tf (var.uv_group_dedup_reconcile).

[build]
builder        = "dockerfile"
dockerfilePath = "src/Dockerfile"

[deploy]
startCommand      = "/app/.venv/bin/python -m src.entrypoints.cli.dedup_reconcile"
cronSchedule      = "0 20 * * *"
restartPolicyType = "never"
