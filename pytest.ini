[pytest]
testpaths =
    src/tests
    backend/tests
    fastembed/src/tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
pythonpath =
    .
    fastembed/src
markers =
    integration: marks tests as integration tests (require running database)
# A hung test (e.g. an asyncio background task that never finishes cancelling on
# FastAPI lifespan shutdown) would otherwise block forever — nothing else in this
# suite enforces a timeout. Per-test, not global: pytest-timeout kills just the
# stuck test and prints its stack, so the rest of the run still completes.
timeout = 60
