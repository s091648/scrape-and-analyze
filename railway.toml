[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Default command — overridden per cron job in the Railway dashboard.
# Cron jobs: "python -m src.main daily|weekly|remediate"
startCommand = "python -m src.main daily"
# Batch job: exits after completion — do not restart.
restartPolicyType = "never"

[deploy.envs]
LLM_PROVIDER = "claude" 
LLM_MODEL = "claude-sonnet-4-20250514"