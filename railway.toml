# Shared by: worker service (Dockerfile) and backend service (backend/Dockerfile)
# Both services have Root Directory = / (repo root) because backend/Dockerfile needs src/
#
# Per-service overrides must be set in Railway Dashboard:
#   - worker:  Start Command = "python -m src.main daily|weekly|remediate"
#              Restart Policy = never
#   - backend: Start Command = (empty, use Dockerfile CMD)
#              Restart Policy = on_failure

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"