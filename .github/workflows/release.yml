name: Release to Production

# Triggered by pushing a version tag (e.g. v1.2.3).
#
# Two paths are supported:
#   PR flow   — pr-automation.yml already wrote {{NEWEST_VERSION}} into
#               release-notes.json; this workflow just stamps the real version.
#   Hotfix    — direct push to master skipped PR automation; this workflow
#               calls generate_release_notes.py as a fallback before stamping.
#
# Re-runs are idempotent: if the tag version is already in release-notes.json
# the stamp phase is skipped entirely.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  release:
    name: Stamp Version & Deploy
    runs-on: ubuntu-latest
    environment: scraper / production

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      # -------------------------------------------------------------------
      # Guard: skip stamp phase if this tag is already in release-notes.json
      # Makes re-runs of a failed release job safe (idempotent).
      # -------------------------------------------------------------------
      - name: Check if version already stamped
        id: check_stamped
        run: |
          if python3 scripts/release/check_stamped.py "${{ github.ref_name }}"; then
            echo "already_stamped=true" >> $GITHUB_OUTPUT
          else
            echo "already_stamped=false" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------------------------
      # Hotfix fallback: generate release notes when no placeholder exists.
      # PR flow: pr-automation.yml already wrote {{NEWEST_VERSION}}, skip.
      # Hotfix:  direct push bypassed PR automation, generate here instead.
      # -------------------------------------------------------------------
      - name: Generate release notes (hotfix fallback)
        if: steps.check_stamped.outputs.already_stamped != 'true'
        run: |
          if grep -q '{{NEWEST_VERSION}}' frontend/public/release-notes.json; then
            echo "Placeholder found — PR flow, skipping generation."
          else
            echo "No placeholder — hotfix flow, generating via LLM."
            PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
            if [ -n "$PREV" ]; then
              uv run python scripts/release/generate_release_notes.py --from-tag "$PREV"
            else
              uv run python scripts/release/generate_release_notes.py
            fi
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .

      # -------------------------------------------------------------------
      # Stamp {{NEWEST_VERSION}} / {{RELEASE_DATE}} placeholders
      # -------------------------------------------------------------------
      - name: Stamp version placeholder
        if: steps.check_stamped.outputs.already_stamped != 'true'
        run: |
          TAG="${{ github.ref_name }}"
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/{{NEWEST_VERSION}}/${TAG}/g" frontend/public/release-notes.json
          sed -i "s/{{RELEASE_DATE}}/${DATE}/g"  frontend/public/release-notes.json
          echo "Stamped ${TAG} (${DATE}) into release-notes.json"

      - name: Commit release notes
        if: steps.check_stamped.outputs.already_stamped != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n 'x-access-token:${{ secrets.RELEASE_PAT }}' | base64)"
          git add frontend/public/release-notes.json
          git diff --staged --quiet || \
            git commit -m "🚀 [RELEASE] stamp ${{ github.ref_name }} in release notes [skip ci]"
          git push origin master

      # -------------------------------------------------------------------
      # Migrate production DB before deploy
      # -------------------------------------------------------------------
      - name: Run alembic upgrade on production DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # -------------------------------------------------------------------
      # Deploy to Railway production
      # -------------------------------------------------------------------
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (production)
        run: |
          railway up --detach --service 54f665be-c49e-407e-bf23-e414587b9984  # dashboard-frontend
          railway up --detach --service d20f24b5-6c3f-4732-a9b8-de13486db754  # dashboard-backend
          railway up --detach --service 3880b0e2-2c02-429f-892c-814a02379e35  # storybook UI
          railway up --detach --service 84433f38-f9e9-4082-bd2e-2af327e3ba69  # scrape-and-analyze
          (cd chatbot-plugin && railway up --detach --service e3a28eae-2765-456e-822c-841598fcf1c2)  # chatbot-plugin
          railway up --detach --service c97be150-c9cc-42d0-a23e-04406573ee93  # fastembed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # -------------------------------------------------------------------
      # Create GitHub Release with the stamped notes as body
      # -------------------------------------------------------------------
      - name: Extract release body from JSON
        id: notes
        run: python3 scripts/release/extract_release_body.py "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
