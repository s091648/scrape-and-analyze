name: Release to Production

# Triggered by pushing a version tag (e.g. v1.2.3).
#
# Two paths are supported:
#   PR flow   — pr-automation.yml already wrote {{NEWEST_VERSION}} into
#               release-notes.json; this workflow just stamps the real version.
#   Hotfix    — direct push to master skipped PR automation; this workflow
#               calls generate_release_notes.py as a fallback before stamping.
#
# Re-runs are idempotent: if the tag version is already in release-notes.json
# the stamp phase is skipped entirely.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Stamp Version & Deploy
    runs-on: ubuntu-latest
    environment: scraper / production

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      # -------------------------------------------------------------------
      # Stamp the tag version into pyproject.toml (currently stuck at 0.1.0).
      # Idempotent: skipped if the file has no diff after the sed.
      # -------------------------------------------------------------------
      - name: Bump pyproject.toml version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

      - name: Commit pyproject.toml version bump
        run: >
          bash "$GITHUB_WORKSPACE/.github/scripts/commit-file-via-api.sh"
          "pyproject.toml" "${{ github.repository }}" "master"
          "🔖 [CHORE] bump pyproject.toml version to ${{ github.ref_name }} [skip ci]"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

      # -------------------------------------------------------------------
      # Guard: skip stamp phase if this tag is already in release-notes.json
      # Makes re-runs of a failed release job safe (idempotent).
      # -------------------------------------------------------------------
      - name: Check if version already stamped
        id: check_stamped
        run: |
          if python3 scripts/release/check_stamped.py "${{ github.ref_name }}"; then
            echo "already_stamped=true" >> $GITHUB_OUTPUT
          else
            echo "already_stamped=false" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------------------------
      # Hotfix fallback: generate release notes when no placeholder exists.
      # PR flow: pr-automation.yml already wrote {{NEWEST_VERSION}}, skip.
      # Hotfix:  direct push bypassed PR automation, generate here instead.
      # -------------------------------------------------------------------
      - name: Generate release notes (hotfix fallback)
        if: steps.check_stamped.outputs.already_stamped != 'true'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/generate-release-notes-fallback.sh" "${{ github.ref_name }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .

      # -------------------------------------------------------------------
      # Stamp {{NEWEST_VERSION}} / {{RELEASE_DATE}} placeholders
      # -------------------------------------------------------------------
      - name: Stamp version placeholder
        if: steps.check_stamped.outputs.already_stamped != 'true'
        run: |
          TAG="${{ github.ref_name }}"
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/{{NEWEST_VERSION}}/${TAG}/g" frontend/public/release-notes.json
          sed -i "s/{{RELEASE_DATE}}/${DATE}/g"  frontend/public/release-notes.json
          echo "Stamped ${TAG} (${DATE}) into release-notes.json"

      - name: Commit release notes
        if: steps.check_stamped.outputs.already_stamped != 'true'
        run: >
          bash "$GITHUB_WORKSPACE/.github/scripts/commit-file-via-api.sh"
          "frontend/public/release-notes.json" "${{ github.repository }}" "master"
          "🚀 [RELEASE] stamp ${{ github.ref_name }} in release notes [skip ci]"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

      # -------------------------------------------------------------------
      # Migrate production DB before deploy
      # -------------------------------------------------------------------
      - name: Run alembic upgrade on production DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run data migrations on production DB
        run: uv run python scripts/run_data_migrations.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # -------------------------------------------------------------------
      # Deploy to Railway production
      # -------------------------------------------------------------------
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (production)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/deploy-production.sh"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID_DASHBOARD_FRONTEND: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_FRONTEND }}
          SERVICE_ID_DASHBOARD_BACKEND: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_BACKEND }}
          SERVICE_ID_STORYBOOK: ${{ vars.RAILWAY_SERVICE_ID_STORYBOOK }}
          SERVICE_ID_SCRAPE_AND_ANALYZE: ${{ vars.RAILWAY_SERVICE_ID_SCRAPE_AND_ANALYZE }}
          SERVICE_ID_CHATBOT_PLUGIN: ${{ vars.RAILWAY_SERVICE_ID_CHATBOT_PLUGIN }}
          SERVICE_ID_FASTEMBED: ${{ vars.RAILWAY_SERVICE_ID_FASTEMBED }}
          SERVICE_ID_WEEKLY_REPORT: ${{ vars.RAILWAY_SERVICE_ID_WEEKLY_REPORT }}
          SERVICE_ID_REFRESH_METRICS: ${{ vars.RAILWAY_SERVICE_ID_REFRESH_METRICS }}
          SERVICE_ID_RAG_BACKFILL: ${{ vars.RAILWAY_SERVICE_ID_RAG_BACKFILL }}

      # -------------------------------------------------------------------
      # Create GitHub Release with the stamped notes as body
      # -------------------------------------------------------------------
      - name: Extract release body from JSON
        id: notes
        run: python3 scripts/release/extract_release_body.py "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
