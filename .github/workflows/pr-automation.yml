name: PR Automation

# Runs once when a PR to master is opened, or on manual workflow_dispatch.
# Job 1 (autogen-vitepress): regenerates VitePress config if specs changed.
# Job 2 (generate-release-notes): asks LLM to summarize commits and commits
#   the result into the {{NEWEST_VERSION}} entry of release-notes.json so the
#   PR reviewer can inspect and approve the notes before merging.

on:
  pull_request:
    types: [opened]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Auto-generate VitePress config from specs (always runs, self-guards)
  # ---------------------------------------------------------------------------
  autogen-vitepress:
    name: Auto-generate VitePress config
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate VitePress config from specs
        run: node scripts/generate-config.mjs
        working-directory: site

      - name: Commit generated config to PR branch
        run: >
          bash "$GITHUB_WORKSPACE/.github/scripts/git-commit-and-push.sh"
          "🤖 [CHORE] auto-update vitepress config from specs"
          "No vitepress config changes to commit"
          site/.vitepress/config.js site/index.md

  # ---------------------------------------------------------------------------
  # Job 2: Generate release notes via LLM (runs after Job 1 to avoid push races)
  # Uses scraper / production environment so DATABASE_URL points to the
  # production DB — it's only ever used for a read-only llm_providers lookup
  # (see generate_release_notes.py), not app schema, and production is never
  # torn down like the staging postgres is by close-staging.yml. This mirrors
  # release.yml's hotfix fallback, which already runs the same script the
  # same way against production.
  # ---------------------------------------------------------------------------
  generate-release-notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    needs: [autogen-vitepress]
    # always() ensures this job runs even when autogen-vitepress is skipped
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'))
    environment: scraper / production

    steps:
      # Fresh checkout to pick up any commits pushed by autogen-vitepress
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # full history needed for git log since last tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Generate release notes
        run: uv run python scripts/release/generate_release_notes.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .

      - name: Commit release notes to PR branch
        run: >
          bash "$GITHUB_WORKSPACE/.github/scripts/git-commit-and-push.sh"
          "🤖 [CHORE] auto-generate release notes"
          "No release notes changes to commit"
          frontend/public/release-notes.json
