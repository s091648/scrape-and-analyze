name: Close Staging Deployments

# Runs once a PR to master is merged, to remove the staging deployments that
# were spun up for review during the PR. Counterpart to the
# check-staging-deployments job in ci.yml, which revives them at PR start.

on:
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: close-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-staging-deployments:
    name: Close Staging Deployments
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    timeout-minutes: 15
    environment: scraper / staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Remove each staging service's deployment now that the PR is merged
        run: |
          set -uo pipefail
          FAILED=0

          # name -> service ID (must match check-staging-deployments/deploy-staging-* in ci.yml)
          # postgres/redis are intentionally NOT here: Railway's CLI has no reliable way to
          # revive a fully-removed DB service (no deployment/image snapshot left to redeploy
          # from — see check-staging-deployments' postgres/redis removal in ci.yml for the
          # incident that proved this out). They stay up permanently instead; idle DB/cache
          # cost is negligible next to the risk of an unrecoverable staging DB.
          declare -A SERVICES=(
            [dashboard-backend]="$SERVICE_ID_DASHBOARD_BACKEND"
            [dashboard-frontend]="$SERVICE_ID_DASHBOARD_FRONTEND"
            [storybook]="$SERVICE_ID_STORYBOOK"
            [scrape-and-analyze]="$SERVICE_ID_SCRAPE_AND_ANALYZE"
            [chatbot-plugin]="$SERVICE_ID_CHATBOT_PLUGIN"
            [fastembed]="$SERVICE_ID_FASTEMBED"
            [weekly-report]="$SERVICE_ID_WEEKLY_REPORT"
            [refresh-metrics]="$SERVICE_ID_REFRESH_METRICS"
            [rag-backfill]="$SERVICE_ID_RAG_BACKFILL"
          )

          for name in "${!SERVICES[@]}"; do
            id="${SERVICES[$name]}"
            echo "::group::Removing $name ($id)"
            if ! railway down --yes --service "$id" --environment staging; then
              echo "::error::Failed to remove staging deployment for $name"
              FAILED=1
            fi
            echo "::endgroup::"
          done

          exit $FAILED
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID_DASHBOARD_BACKEND: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_BACKEND }}
          SERVICE_ID_DASHBOARD_FRONTEND: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_FRONTEND }}
          SERVICE_ID_STORYBOOK: ${{ vars.RAILWAY_SERVICE_ID_STORYBOOK }}
          SERVICE_ID_SCRAPE_AND_ANALYZE: ${{ vars.RAILWAY_SERVICE_ID_SCRAPE_AND_ANALYZE }}
          SERVICE_ID_CHATBOT_PLUGIN: ${{ vars.RAILWAY_SERVICE_ID_CHATBOT_PLUGIN }}
          SERVICE_ID_FASTEMBED: ${{ vars.RAILWAY_SERVICE_ID_FASTEMBED }}
          SERVICE_ID_WEEKLY_REPORT: ${{ vars.RAILWAY_SERVICE_ID_WEEKLY_REPORT }}
          SERVICE_ID_REFRESH_METRICS: ${{ vars.RAILWAY_SERVICE_ID_REFRESH_METRICS }}
          SERVICE_ID_RAG_BACKFILL: ${{ vars.RAILWAY_SERVICE_ID_RAG_BACKFILL }}
