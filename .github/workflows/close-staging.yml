name: Close Staging Deployments

# Runs once a PR to master is merged, to remove the staging deployments that
# were spun up for review during the PR. Counterpart to the
# check-staging-deployments job in ci.yml, which revives them at PR start.

on:
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: close-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-staging-deployments:
    name: Close Staging Deployments
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    timeout-minutes: 15
    environment: scraper / staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Remove each staging service's deployment now that the PR is merged
        run: |
          set -uo pipefail
          FAILED=0

          # name -> service ID (must match check-staging-deployments/deploy-staging-* in ci.yml)
          declare -A SERVICES=(
            [dashboard-backend]="d20f24b5-6c3f-4732-a9b8-de13486db754"
            [dashboard-frontend]="54f665be-c49e-407e-bf23-e414587b9984"
            [storybook]="3880b0e2-2c02-429f-892c-814a02379e35"
            [scrape-and-analyze]="84433f38-f9e9-4082-bd2e-2af327e3ba69"
            [chatbot-plugin]="e3a28eae-2765-456e-822c-841598fcf1c2"
            [fastembed]="c97be150-c9cc-42d0-a23e-04406573ee93"
          )

          for name in "${!SERVICES[@]}"; do
            id="${SERVICES[$name]}"
            echo "::group::Removing $name ($id)"
            if ! railway down --yes --service "$id" --environment staging; then
              echo "::error::Failed to remove staging deployment for $name"
              FAILED=1
            fi
            echo "::endgroup::"
          done

          exit $FAILED
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
