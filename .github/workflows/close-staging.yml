name: Close Staging Service

# Reusable workflow: tears down ONE staging Railway service's deployment. Called once per
# service as a job in ci.yml's push-to-master flow (see ci.yml's close-staging-* jobs),
# mirroring how ci.yml calls lighthouse.yml. Counterpart to check-staging-deployments (in
# ci.yml), which revives services at PR start.
#
# Split per-service (rather than one "close everything" job looping over every Railway
# service, which is what this used to do) so each service's teardown can carry its own
# concurrency group scoped to just that service — see ci.yml's deploy-staging-*/
# close-staging-* `concurrency:` blocks for why: a shared, PR-wide group meant unrelated
# deploy jobs for the same PR would cancel each other out (only the most-recently-queued
# survives GitHub's "one pending job per group" rule).
#
# Previously triggered directly by `pull_request: closed`, independent of ci.yml. Moved
# into ci.yml (called only from its push-to-master path, i.e. post-merge) because the two
# workflows firing at the same instant on merge had no real ordering guarantee relative to
# each other — folding this in lets each close-staging-* job's `needs:` wait on that same
# run's own relevant test jobs before tearing anything down, the same guarantee
# `deploy-staging-*` already had.
#
# `railway down` doesn't read repository content (unlike `railway up`, which deploys
# whatever's checked out), so no checkout step is needed here.

on:
  workflow_call:
    inputs:
      service_name:
        description: "Human-readable service name, for step/job labeling"
        required: true
        type: string
      service_id:
        description: "Railway service ID to remove the staging deployment for"
        required: true
        type: string

jobs:
  close:
    name: Close ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: scraper / staging

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Remove staging deployment for ${{ inputs.service_name }}
        run: railway down --yes --service "${{ inputs.service_id }}" --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
