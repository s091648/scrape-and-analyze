name: Close Staging Deployments

# Runs once a PR to master is merged, to remove the staging deployments that
# were spun up for review during the PR. Counterpart to the
# check-staging-deployments job in ci.yml, which revives them at PR start.

on:
  pull_request:
    types: [closed]
    branches: [master]

# Shared group name with ci.yml's staging-touching jobs (check-staging-deployments,
# migrate, deploy-staging-*, lighthouse-check, rollback) — a merge fires this workflow
# and a fresh ci.yml push-run at the same instant, and if the PR's own last ci.yml run
# (from its final commit) is still in flight, teardown here would otherwise race it on
# the same Railway services. cancel-in-progress: false means this queues behind any
# still-running job in the group instead of cancelling it or racing it.
concurrency:
  group: staging-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-staging-deployments:
    name: Close Staging Deployments
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    timeout-minutes: 15
    environment: scraper / staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Remove each staging service's deployment now that the PR is merged
        run: bash "$GITHUB_WORKSPACE/.github/scripts/close-staging-deployments.sh"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID_DASHBOARD_BACKEND: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_BACKEND }}
          SERVICE_ID_DASHBOARD_FRONTEND: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_FRONTEND }}
          SERVICE_ID_STORYBOOK: ${{ vars.RAILWAY_SERVICE_ID_STORYBOOK }}
          SERVICE_ID_SCRAPE_AND_ANALYZE: ${{ vars.RAILWAY_SERVICE_ID_SCRAPE_AND_ANALYZE }}
          SERVICE_ID_CHATBOT_PLUGIN: ${{ vars.RAILWAY_SERVICE_ID_CHATBOT_PLUGIN }}
          SERVICE_ID_FASTEMBED: ${{ vars.RAILWAY_SERVICE_ID_FASTEMBED }}
          SERVICE_ID_WEEKLY_REPORT: ${{ vars.RAILWAY_SERVICE_ID_WEEKLY_REPORT }}
          SERVICE_ID_REFRESH_METRICS: ${{ vars.RAILWAY_SERVICE_ID_REFRESH_METRICS }}
          SERVICE_ID_RAG_BACKFILL: ${{ vars.RAILWAY_SERVICE_ID_RAG_BACKFILL }}
