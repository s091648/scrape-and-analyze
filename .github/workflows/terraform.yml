name: Terraform

# Reusable infra runner for 025-iac-provisioning — the GITHUB-ACTIONS half only.
# ci.yml / release.yml call it with `uses:` + two inputs. It runs `terraform`
# against github-ci.tf (the GitHub Actions secrets/variables ci.yml/release.yml
# read), on the HCP Terraform workspace selected by TF_WORKSPACE.
#
# The Railway half (every service's deploy config + env vars) moved to
# .railway/railway.ts + `railway config` — see .github/workflows/railway-config.yml
# (Revision 6). scripts/push_railway_variables.py / railway-services.json were
# retired in T6-09.
#
# Called as a job:
#   uses: ./.github/workflows/terraform.yml
#   with: { mode: plan|apply|drift, environment: staging|production }
#   secrets: inherit
#
# tfvars are materialized from base64 GitHub Actions secrets
# (TF_TFVARS_{GITHUB,RAILWAY}_{SHARED,STAGING,PRODUCTION}), kept in sync from a
# maintainer's machine via `make push-tfvars`. Terraform reads only github-*;
# railway-config.yml explodes railway-* into $GITHUB_ENV via tfvars_to_env.py.

on:
  workflow_call:
    inputs:
      mode:
        description: "plan | apply | drift"
        required: true
        type: string
      environment:
        description: "staging | production"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | apply | drift"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, drift]
      environment:
        description: "staging | production"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  terraform:
    name: infra ${{ inputs.mode }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: scraper / ${{ inputs.environment }}

    # backend.tf pins the HCP Terraform backend with `workspaces { tags = [...] }`
    # (not a hard-coded `name`), so EVERY terraform command — `init` included —
    # needs TF_WORKSPACE to know whether it's targeting the `staging` or
    # `production` workspace of the `scrape-analyzer` org. Set at job level (not
    # just on the plan/apply step) because `terraform init -input=false` with no
    # workspace selected otherwise falls back to a non-existent "default"
    # workspace and fails ("Currently selected workspace \"default\" does not exist").
    env:
      TF_WORKSPACE: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Recreate the git-ignored secrets/*.tfvars from base64 GitHub secrets:
      # both *-shared layers + only the target environment's *-<env> overlay.
      - name: Materialize tfvars
        env:
          TF_TFVARS_GITHUB_SHARED: ${{ secrets.TF_TFVARS_GITHUB_SHARED }}
          TF_TFVARS_RAILWAY_SHARED: ${{ secrets.TF_TFVARS_RAILWAY_SHARED }}
          TF_TFVARS_GITHUB_STAGING: ${{ secrets.TF_TFVARS_GITHUB_STAGING }}
          TF_TFVARS_RAILWAY_STAGING: ${{ secrets.TF_TFVARS_RAILWAY_STAGING }}
          TF_TFVARS_GITHUB_PRODUCTION: ${{ secrets.TF_TFVARS_GITHUB_PRODUCTION }}
          TF_TFVARS_RAILWAY_PRODUCTION: ${{ secrets.TF_TFVARS_RAILWAY_PRODUCTION }}
        run: |
          set -euo pipefail
          cd infra/terraform/github
          printf '%s' "$TF_TFVARS_GITHUB_SHARED"  | base64 -d > secrets/github-shared.tfvars
          printf '%s' "$TF_TFVARS_RAILWAY_SHARED" | base64 -d > secrets/railway-shared.tfvars
          case "${{ inputs.environment }}" in
            staging)
              printf '%s' "$TF_TFVARS_GITHUB_STAGING"  | base64 -d > secrets/github-staging.tfvars
              printf '%s' "$TF_TFVARS_RAILWAY_STAGING" | base64 -d > secrets/railway-staging.tfvars ;;
            production)
              printf '%s' "$TF_TFVARS_GITHUB_PRODUCTION"  | base64 -d > secrets/github-production.tfvars
              printf '%s' "$TF_TFVARS_RAILWAY_PRODUCTION" | base64 -d > secrets/railway-production.tfvars ;;
            *) echo "::error::unknown environment '${{ inputs.environment }}'"; exit 1 ;;
          esac

      - name: terraform init
        run: terraform -chdir=infra/terraform/github init -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: terraform fmt -check
        if: inputs.mode == 'plan'
        run: terraform -chdir=infra/terraform/github fmt -check -recursive

      - name: terraform validate
        if: inputs.mode == 'plan'
        run: terraform -chdir=infra/terraform/github validate

      # GitHub-side (github-ci.tf). `drift` is `plan -detailed-exitcode`
      # (exit 2 = drift) written to the job summary.
      - name: terraform ${{ inputs.mode }} (GitHub Actions config)
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd infra/terraform/github
          VF="-var-file=secrets/github-shared.tfvars -var-file=secrets/github-${{ inputs.environment }}.tfvars"
          case "${{ inputs.mode }}" in
            plan)  terraform plan  -no-color -input=false $VF ;;
            apply) terraform apply -no-color -input=false -auto-approve $VF ;;
            drift)
              set +e
              terraform plan -no-color -input=false -detailed-exitcode $VF
              code=$?
              set -e
              if [ "$code" = "0" ]; then echo "✅ ${{ inputs.environment }} GitHub config: in sync" >> "$GITHUB_STEP_SUMMARY"
              elif [ "$code" = "2" ]; then echo "⚠️ ${{ inputs.environment }} GitHub config: DRIFT (see log)" >> "$GITHUB_STEP_SUMMARY"; exit 1
              else echo "❌ ${{ inputs.environment }} GitHub config: plan failed (exit $code)" >> "$GITHUB_STEP_SUMMARY"; exit "$code"; fi ;;
            *) echo "::error::unknown mode '${{ inputs.mode }}'"; exit 1 ;;
          esac
          # The Railway half (service env vars) is applied separately by
          # .github/workflows/railway-config.yml — not here (T6-09).
