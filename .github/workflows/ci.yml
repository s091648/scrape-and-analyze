      cancel-in-progress: false

  close-staging-rag-backfill:
    name: Close RAG Backfill Staging Deployment
    needs: [resolve-merged-pr, src-unit-test, src-integration-test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.resolve-merged-pr.result == 'success'
    uses: ./.github/workflows/close-staging.yml
    with:
      service_name: rag-backfill
      service_id: ${{ vars.RAILWAY_SERVICE_ID_RAG_BACKFILL }}
    secrets: inherit
    concurrency:
      group: staging-rag-backfill-${{ needs.resolve-merged-pr.outputs.pr_number }}
      cancel-in-progress: false

  close-staging-dedup-reconcile:
    name: Close Dedup Reconcile Staging Deployment
    needs: [resolve-merged-pr, src-unit-test, src-integration-test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.resolve-merged-pr.result == 'success'
    uses: ./.github/workflows/close-staging.yml
    with:
      service_name: dedup-reconcile
      service_id: ${{ vars.RAILWAY_SERVICE_ID_DEDUP_RECONCILE }}
    secrets: inherit
    concurrency:
      group: staging-dedup-reconcile-${{ needs.resolve-merged-pr.outputs.pr_number }}
