name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # -----------------------------------------------
  # Stage 1: Unit Tests (no external dependencies)
  # -----------------------------------------------
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

  # -----------------------------------------------
  # Stage 2: Integration Tests (requires Postgres)
  # -----------------------------------------------
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: digital_twins
          POSTGRES_PASSWORD: digital_twins
          POSTGRES_DB: digital_twins
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digital_twins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: psql -h localhost -U digital_twins -c "CREATE DATABASE digital_twins_test;"
        env:
          PGPASSWORD: digital_twins

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m integration
        env:
          DATABASE_URL: postgresql://digital_twins:digital_twins@localhost:5432/digital_twins_test

  # -----------------------------------------------
  # Stage 3: Docker Build (catches packaging issues)
  # -----------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t digital-twins-scraper .
