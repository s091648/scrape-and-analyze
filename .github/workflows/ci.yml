name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------------
  # Stage -1: Check & revive staging deployments
  # (staging deployments get manually removed after a PR closes;
  # bring back anything that's REMOVED before migrate/tests run against it)
  # -----------------------------------------------
  check-staging-deployments:
    name: Check & Revive Staging Deployments
    runs-on: ubuntu-latest
    # PR-review context only. A push to master is always a post-merge push (branch
    # protection forbids direct pushes), which fires this same workflow's
    # close-staging-* jobs (see "Stage 6" below) at the same instant — racing against
    # them to revive deployments they're concurrently tearing down. Nothing here is
    # needed once the PR is merged.
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    environment: scraper / staging
    # Shares migrate/rollback's group rather than getting a per-service one like
    # deploy-staging-*/close-staging-* below: this job loops over *every* staging
    # service in one shot (railway-services.sh), so it can't cleanly join just one
    # service's group without still leaving the other nine services it also touches
    # unprotected. Splitting this into one job per service (mirroring deploy-staging-*)
    # would close that gap but is a separate refactor — for now it only serializes
    # against the DB-focused jobs it happens to share a group with, not per-service
    # against close-staging-*. In practice this is low-risk: it only runs early in a
    # PR's own run (gated on nothing else), well before that same PR could have a
    # push-triggered close-staging-* run in flight.
    concurrency:
      group: staging-db-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      # `railway up` deploys whatever is in the working directory, so the
      # checkout above is deliberately pinned to master — reviving a REMOVED
      # service must redeploy known-good master code, never this PR's
      # untested branch. But that also means .github/scripts/ here is
      # master's copy, which doesn't yet include changes this very PR makes
      # to these scripts. Overlay just the CI script tree from the ref this
      # workflow is actually running as (the PR's merge preview, or master
      # itself on a push) into a separate directory so a PR editing these
      # scripts can still test itself before merging — without touching what
      # gets redeployed.
      - name: Checkout current ref's CI scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts
          path: _ci-scripts

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Check each staging service and redeploy REMOVED ones from master
        run: bash "$GITHUB_WORKSPACE/_ci-scripts/.github/scripts/check-staging-deployments.sh"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID_DASHBOARD_BACKEND: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_BACKEND }}
          SERVICE_ID_DASHBOARD_FRONTEND: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_FRONTEND }}
          SERVICE_ID_STORYBOOK: ${{ vars.RAILWAY_SERVICE_ID_STORYBOOK }}
          SERVICE_ID_SCRAPE_AND_ANALYZE: ${{ vars.RAILWAY_SERVICE_ID_SCRAPE_AND_ANALYZE }}
          SERVICE_ID_CHATBOT_PLUGIN: ${{ vars.RAILWAY_SERVICE_ID_CHATBOT_PLUGIN }}
          SERVICE_ID_FASTEMBED: ${{ vars.RAILWAY_SERVICE_ID_FASTEMBED }}
          SERVICE_ID_WEEKLY_REPORT: ${{ vars.RAILWAY_SERVICE_ID_WEEKLY_REPORT }}
          SERVICE_ID_REFRESH_METRICS: ${{ vars.RAILWAY_SERVICE_ID_REFRESH_METRICS }}
          SERVICE_ID_RAG_BACKFILL: ${{ vars.RAILWAY_SERVICE_ID_RAG_BACKFILL }}
          SERVICE_ID_DEDUP_RECONCILE: ${{ vars.RAILWAY_SERVICE_ID_DEDUP_RECONCILE }}

  # -----------------------------------------------
  # Stage 0: DB Migration (PR only)
  # push-to-master (post-merge) skips this: it would race the staging DB
  # against itself if a still-in-flight PR run's migrate overlapped, and it
  # isn't needed there anyway — the next PR to revive staging brings it to
  # its own head, which already includes this merge's migrations. Downstream
  # jobs already treat migrate's `skipped` result the same as `success`.
  # -----------------------------------------------
  migrate:
    name: DB Migration
    runs-on: ubuntu-latest
    needs: [check-staging-deployments]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.check-staging-deployments.result == 'success' || needs.check-staging-deployments.result == 'skipped')
    timeout-minutes: 10
    environment: scraper / staging
    concurrency:
      group: staging-db-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run alembic upgrade
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run data migrations
        run: uv run python scripts/run_data_migrations.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # -----------------------------------------------
  # Stage 1: Src Unit Tests (no external dependencies)
  # -----------------------------------------------
  src-unit-test:
    name: Src Unit Tests
    runs-on: ubuntu-latest
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run unit tests with coverage
        run: uv run pytest src/tests/unit/ -v --tb=short --cov=src --cov=shared --cov-report=xml:coverage.xml --junitxml=pytest.xml

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          title: Src Unit Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: >
          bash "$GITHUB_WORKSPACE/.github/scripts/compute-pytest-pass-rate.sh"
          "${{ steps.coverage.outputs.tests }}"
          "${{ steps.coverage.outputs.failures }}"
          "${{ steps.coverage.outputs.errors }}"
          "${{ steps.coverage.outputs.skipped }}"

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update src unit pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: src-unit-passrate.json
          label: src unit tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 1b: Backend Unit Tests (parallel track)
  # -----------------------------------------------
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    timeout-minutes: 15

    env:
      CI_DB_USER: ci
      CI_DB_PASSWORD: ci
      CI_DB_NAME: ci_test

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --group backend --group dev --group observability
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run alembic upgrade for test DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Run backend unit tests with coverage
        run: uv run pytest backend/tests/ -v --tb=short --ignore=backend/tests/integration --cov=backend --cov=shared --cov-report=xml:coverage-backend.xml --junitxml=pytest-backend.xml
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Upload backend-unit coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-backend.xml
          flags: backend-unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage-backend.xml
          junitxml-path: ./pytest-backend.xml
          title: Backend Unit Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: >
          bash "$GITHUB_WORKSPACE/.github/scripts/compute-pytest-pass-rate.sh"
          "${{ steps.coverage.outputs.tests }}"
          "${{ steps.coverage.outputs.failures }}"
          "${{ steps.coverage.outputs.errors }}"
          "${{ steps.coverage.outputs.skipped }}"

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update backend unit pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: backend-unit-passrate.json
          label: backend unit tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 1c: Backend Integration Tests (requires Postgres)
  # -----------------------------------------------
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-unit]
    timeout-minutes: 20

    env:
      CI_DB_USER: ci
      CI_DB_PASSWORD: ci
      CI_DB_NAME: ci_test

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --group backend --group dev --group observability
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run alembic upgrade for test DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Run backend integration tests with coverage
        run: uv run pytest backend/tests/integration/ -v --tb=short -m integration --cov=backend --cov=shared --cov-report=xml:coverage-backend-integration.xml --junitxml=pytest-backend-integration.xml
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
          REDIS_URL: redis://localhost:6379/0
          CACHE_REDIS_URL: redis://localhost:6379/1

      - name: Upload backend-integration coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-backend-integration.xml
          flags: backend-integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage-backend-integration.xml
          junitxml-path: ./pytest-backend-integration.xml
          title: Backend Integration Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: >
          bash "$GITHUB_WORKSPACE/.github/scripts/compute-pytest-pass-rate.sh"
          "${{ steps.coverage.outputs.tests }}"
          "${{ steps.coverage.outputs.failures }}"
          "${{ steps.coverage.outputs.errors }}"
          "${{ steps.coverage.outputs.skipped }}"

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update backend integration pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: backend-integration-passrate.json
          label: backend integration tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 2: Src Integration Tests (requires Postgres)
  # -----------------------------------------------
  src-integration-test:
    name: Src Integration Tests
    runs-on: ubuntu-latest
    needs: [migrate, src-unit-test]
    if: |
      always() &&
      needs.src-unit-test.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    timeout-minutes: 30

    env:
      CI_DB_USER: ci
      CI_DB_PASSWORD: ci
      CI_DB_NAME: ci_test

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run alembic upgrade for test DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Run integration tests with coverage
        run: uv run pytest src/tests/integration/ -v --tb=short -m integration --cov=src --cov=shared --cov-report=xml:coverage-integration.xml --junitxml=pytest-integration.xml
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-integration.xml
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage-integration.xml
          junitxml-path: ./pytest-integration.xml
          title: Src Integration Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: >
          bash "$GITHUB_WORKSPACE/.github/scripts/compute-pytest-pass-rate.sh"
          "${{ steps.coverage.outputs.tests }}"
          "${{ steps.coverage.outputs.failures }}"
          "${{ steps.coverage.outputs.errors }}"
          "${{ steps.coverage.outputs.skipped }}"

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update src integration pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: src-integration-passrate.json
          label: src integration tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 3a: Frontend Unit Tests (parallel track)
  # -----------------------------------------------
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run vitest with coverage
        run: npm run test:coverage -- --reporter=verbose --reporter=json --outputFile=test-results.json
        continue-on-error: true

      - name: Fix lcov paths for monorepo upload
        run: sed -i 's|SF:|SF:frontend/|g' coverage/lcov.info

      - name: Upload frontend-unit coverage to Codecov
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend-unit
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Compute pass rate
        id: passrate
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/compute-vitest-pass-rate.sh"

      - name: Update frontend unit pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: frontend-unit-passrate.json
          label: frontend unit tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 3b: Frontend E2E Tests (after frontend-unit)
  # -----------------------------------------------
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: frontend-unit
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Only the ~280MB browser binary download is worth caching — the `--with-deps`
      # apt packages below are mostly already baked into the runner image (see the
      # "already the newest version" lines a cold run logs for nearly all of them) and
      # the image itself is freshly provisioned per job, so there's nothing for
      # actions/cache to save there. Keyed on package-lock.json so a Playwright version
      # bump naturally invalidates the cache instead of running a mismatched browser.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

      - name: Compute e2e pass rate
        id: passrate
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/compute-playwright-pass-rate.sh"

      - name: Update frontend e2e pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: frontend-e2e-passrate.json
          label: frontend e2e tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 4a: Deploy Backend to Staging (PR only)
  # -----------------------------------------------
  deploy-staging-backend:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.backend-unit.result == 'success' &&
      needs.backend-integration.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-backend-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy dashboard-backend to Railway (staging)
        run: railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_BACKEND }} --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 4b: Deploy Frontend to Staging (PR only)
  # -----------------------------------------------
  deploy-staging-frontend:
    name: Deploy Frontend to Staging
    runs-on: ubuntu-latest
    needs: [frontend-unit, frontend-e2e]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.frontend-unit.result == 'success' &&
      needs.frontend-e2e.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-frontend-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy dashboard-frontend to Railway (staging)
        run: railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_FRONTEND }} --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 4b1: Lighthouse Performance Check (staging, PR only)
  # Gates PR merge on the check completing without route failures (022-lighthouse-
  # performance-check, US3) — not yet on the actual Performance/LCP/TBT/CLS numbers.
  # Runs against vars.FRONTEND_URL (configure in repo Settings → Secrets and
  # variables → Actions → Variables); to make this a required check, add "Lighthouse
  # Performance Check / lighthouse-check" in branch protection rules for master.
  # Can also be run standalone via workflow_dispatch on lighthouse.yml against any URL.
  # No concurrency group needed: this only reads the already-deployed frontend (an
  # audit, not a mutation), so it doesn't need to serialize against deploy-staging-
  # frontend/close-staging-frontend the way `railway up`/`railway down` calls do.
  # -----------------------------------------------
  lighthouse-check:
    name: Lighthouse Performance Check
    needs: [deploy-staging-frontend]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.deploy-staging-frontend.result == 'success'
    uses: ./.github/workflows/lighthouse.yml
    with:
      url: ${{ vars.FRONTEND_URL }}
    secrets: inherit

  # -----------------------------------------------
  # Stage 4b2: Deploy Storybook to Staging (PR only)
  # -----------------------------------------------
  deploy-staging-storybook:
    name: Deploy Storybook to Staging
    runs-on: ubuntu-latest
    needs: [frontend-unit, frontend-e2e]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.frontend-unit.result == 'success' &&
      needs.frontend-e2e.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-storybook-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy storybook to Railway (staging)
        run: railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_STORYBOOK }} --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 4c: Deploy Scrape-Analyzer to Staging (PR only)
  # -----------------------------------------------
  deploy-staging-src:
    name: Deploy Scrape-Analyzer to Staging
    runs-on: ubuntu-latest
    needs: [src-unit-test, src-integration-test]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.src-unit-test.result == 'success' &&
      needs.src-integration-test.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-src-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy scrape-and-analyze to Railway (staging)
        run: railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_SCRAPE_AND_ANALYZE }} --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 4d: Deploy Chatbot Plugin to Staging (PR only)
  # -----------------------------------------------
  deploy-staging-chatbot:
    name: Deploy Chatbot Plugin to Staging
    runs-on: ubuntu-latest
    needs: [src-unit-test]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.src-unit-test.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-chatbot-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy chatbot-plugin to Railway (staging)
        run: (cd chatbot-plugin && railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_CHATBOT_PLUGIN }} --environment staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 4e: Deploy Fastembed to Staging (PR only)
  # -----------------------------------------------
  deploy-staging-fastembed:
    name: Deploy Fastembed to Staging
    runs-on: ubuntu-latest
    needs: [src-unit-test]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.src-unit-test.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-fastembed-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy fastembed to Railway (staging)
        run: railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_FASTEMBED }} --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 4f: Deploy Weekly Report to Staging (PR only)
  # Shares the src/ codebase & Dockerfile with deploy-staging-src — see
  # src/railway.toml for the UV_GROUPS/Start Command overrides that make
  # this a distinct Railway service from the main worker.
  # -----------------------------------------------
  deploy-staging-weekly-report:
    name: Deploy Weekly Report to Staging
    runs-on: ubuntu-latest
    needs: [src-unit-test, src-integration-test]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.src-unit-test.result == 'success' &&
      needs.src-integration-test.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-weekly-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy weekly-report to Railway (staging)
        run: railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_WEEKLY_REPORT }} --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 4g: Deploy Refresh Metrics to Staging (PR only)
  # Shares the src/ codebase & Dockerfile with deploy-staging-src — see
  # src/railway.toml for the UV_GROUPS/Start Command overrides that make
  # this a distinct Railway service from the main worker.
  # -----------------------------------------------
  deploy-staging-refresh-metrics:
    name: Deploy Refresh Metrics to Staging
    runs-on: ubuntu-latest
    needs: [src-unit-test, src-integration-test]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.src-unit-test.result == 'success' &&
      needs.src-integration-test.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-refresh-metrics-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy refresh-metrics to Railway (staging)
        run: railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_REFRESH_METRICS }} --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 4h: Deploy RAG Backfill to Staging (PR only)
  # Shares the src/ codebase & Dockerfile with deploy-staging-src — see
  # src/railway.toml for the UV_GROUPS/Start Command overrides that make
  # this a distinct Railway service from the main worker.
  # -----------------------------------------------
  deploy-staging-rag-backfill:
    name: Deploy RAG Backfill to Staging
    runs-on: ubuntu-latest
    needs: [src-unit-test, src-integration-test]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.src-unit-test.result == 'success' &&
      needs.src-integration-test.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-rag-backfill-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy rag-backfill to Railway (staging)
        run: railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_RAG_BACKFILL }} --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 4i: Deploy Dedup Reconcile to Staging (PR only)
  # Shares the src/ codebase & Dockerfile with deploy-staging-src — see
  # src/railway.toml for the UV_GROUPS/Start Command overrides that make
  # this a distinct Railway service from the main worker.
  # -----------------------------------------------
  deploy-staging-dedup-reconcile:
    name: Deploy Dedup Reconcile to Staging
    runs-on: ubuntu-latest
    needs: [src-unit-test, src-integration-test]
    # PR-review context only — see check-staging-deployments for why.
    if: |
      github.event_name == 'pull_request' &&
      needs.src-unit-test.result == 'success' &&
      needs.src-integration-test.result == 'success'
    environment: scraper / staging
    concurrency:
      group: staging-dedup-reconcile-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy dedup-reconcile to Railway (staging)
        run: railway up --detach --service ${{ vars.RAILWAY_SERVICE_ID_DEDUP_RECONCILE }} --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 5: DB Rollback (if migrate succeeded but any test failed)
  # -----------------------------------------------
  rollback:
    name: DB Rollback
    runs-on: ubuntu-latest
    needs: [migrate, src-unit-test, src-integration-test, backend-unit, backend-integration, frontend-unit, frontend-e2e]
    if: |
      always() &&
      needs.migrate.result == 'success' &&
      (
        needs.src-unit-test.result == 'failure' ||
        needs.src-integration-test.result == 'failure' ||
        needs.backend-unit.result == 'failure' ||
        needs.backend-integration.result == 'failure' ||
        needs.frontend-unit.result == 'failure' ||
        needs.frontend-e2e.result == 'failure'
      )
    environment: scraper / staging
    concurrency:
      group: staging-db-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Rollback one revision
        run: uv run alembic downgrade -1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # -----------------------------------------------
  # Stage 6: Close Staging Deployments (post-merge only)
  # push-to-master only fires post-merge (branch protection forbids direct pushes), so
  # this whole stage is the merged-PR teardown path — the counterpart to
  # check-staging-deployments (Stage -1), which revives services at PR start. Replaces
  # the old separate close-staging.yml (triggered directly by `pull_request: closed`,
  # racing this workflow with no real ordering guarantee) — folding it in here lets each
  # close-staging-* job's `needs:` wait on this run's own relevant test jobs first, same
  # as deploy-staging-* already does.
  # -----------------------------------------------

  # A push event has no `github.event.pull_request` context, so the PR number that
  # deploy-staging-*'s concurrency groups were keyed on isn't directly available —
  # resolve it from the merge commit via the GitHub API so close-staging-* below can
  # join the *same* group its corresponding deploy-staging-* job used, and correctly
  # queue behind a still-in-flight deploy for that same PR/service instead of racing it.
  resolve-merged-pr:
    name: Resolve Merged PR Number
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}

    steps:
      - name: Look up the merged PR number for this commit
        id: resolve
        run: |
          NUMBER=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            echo "::error::Could not resolve a merged PR number for commit ${{ github.sha }} — skipping staging teardown"
            exit 1
          fi
          echo "pr_number=$NUMBER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  close-staging-backend:
    name: Close Backend Staging Deployment
    needs: [resolve-merged-pr, backend-unit, backend-integration]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.resolve-merged-pr.result == 'success'
    uses: ./.github/workflows/close-staging.yml
    with:
      service_name: dashboard-backend
      service_id: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_BACKEND }}
    secrets: inherit
    concurrency:
      group: staging-backend-${{ needs.resolve-merged-pr.outputs.pr_number }}
      cancel-in-progress: false

  close-staging-frontend:
    name: Close Frontend Staging Deployment
    needs: [resolve-merged-pr, frontend-unit, frontend-e2e]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.resolve-merged-pr.result == 'success'
    uses: ./.github/workflows/close-staging.yml
    with:
      service_name: dashboard-frontend
      service_id: ${{ vars.RAILWAY_SERVICE_ID_DASHBOARD_FRONTEND }}
    secrets: inherit
    concurrency:
      group: staging-frontend-${{ needs.resolve-merged-pr.outputs.pr_number }}
      cancel-in-progress: false

  close-staging-storybook:
    name: Close Storybook Staging Deployment
    needs: [resolve-merged-pr, frontend-unit, frontend-e2e]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.resolve-merged-pr.result == 'success'
    uses: ./.github/workflows/close-staging.yml
    with:
      service_name: storybook
      service_id: ${{ vars.RAILWAY_SERVICE_ID_STORYBOOK }}
    secrets: inherit
    concurrency:
      group: staging-storybook-${{ needs.resolve-merged-pr.outputs.pr_number }}
