  close-staging-src:
    name: Close Scrape-Analyzer Staging Deployment
    needs: [resolve-merged-pr, src-unit-test, src-integration-test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.resolve-merged-pr.result == 'success'
    uses: ./.github/workflows/close-staging.yml
    with:
      service_name: scrape-and-analyze
      service_id: ${{ vars.RAILWAY_SERVICE_ID_SCRAPE_AND_ANALYZE }}
    secrets: inherit
    concurrency:
