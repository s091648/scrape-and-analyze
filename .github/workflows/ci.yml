name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------------
  # Stage 1: Unit Tests (no external dependencies)
  # -----------------------------------------------
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --tb=short --cov=src --cov-report=xml:coverage.xml --junitxml=pytest.xml

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path:./coverage.xml
          junitxml-path: ./pytest.xml
          title: Unit Test Coverage

      - name: Update README — unit test badges and report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          COVERAGE_BADGE: ${{ steps.coverage.outputs.coverageHtml }}
          REPORT_HTML: ${{ steps.coverage.outputs.summaryReport }}
          TESTS: ${{ steps.coverage.outputs.tests }}
          FAILURES: ${{ steps.coverage.outputs.failures }}
          ERRORS: ${{ steps.coverage.outputs.errors }}
          SKIPPED: ${{ steps.coverage.outputs.skipped }}
        run: |
          python - <<'EOF'
          import os, re

          coverage_badge = os.environ['COVERAGE_BADGE']
          report         = os.environ['REPORT_HTML']

          tests    = int(os.environ.get('TESTS',    '0') or 0)
          failures = int(os.environ.get('FAILURES', '0') or 0)
          errors   = int(os.environ.get('ERRORS',   '0') or 0)
          skipped  = int(os.environ.get('SKIPPED',  '0') or 0)
          passed   = tests - failures - errors - skipped

          if tests == 0:
              color, msg = 'lightgrey', 'no%20tests'
          elif failures + errors == 0:
              color, msg = 'brightgreen', f'{passed}%2F{tests}%20passed'
          elif passed / tests >= 0.9:
              color, msg = 'green',       f'{passed}%2F{tests}%20passed'
          elif passed / tests >= 0.75:
              color, msg = 'yellow',      f'{passed}%2F{tests}%20passed'
          else:
              color, msg = 'red',         f'{passed}%2F{tests}%20passed'

          passrate_badge = (
              f'<img src="https://img.shields.io/badge/unit%20tests-{msg}-{color}"'
              f' alt="unit test results">'
          )

          with open('README.md', 'r') as f:
              content = f.read()

          content = re.sub(
              r'<!-- Unit-Badge:Begin -->.*?<!-- Unit-Badge:End -->',
              f'<!-- Unit-Badge:Begin -->\n{coverage_badge}\n<!-- Unit-Badge:End -->',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'<!-- Unit-Passrate-Badge:Begin -->.*?<!-- Unit-Passrate-Badge:End -->',
              f'<!-- Unit-Passrate-Badge:Begin -->\n{passrate_badge}\n<!-- Unit-Passrate-Badge:End -->',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'<!-- Pytest Coverage Comment:Begin -->.*?<!-- Pytest Coverage Comment:End -->',
              f'<!-- Pytest Coverage Comment:Begin -->\n{report}\n<!-- Pytest Coverage Comment:End -->',
              content, flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Commit README (unit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update unit test badges [skip ci]"
          file_pattern: README.md

  # -----------------------------------------------
  # Stage 2: Integration Tests (requires Postgres)
  # -----------------------------------------------
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 30

    env:
      CI_DB_USER: ci
      CI_DB_PASSWORD: ci
      CI_DB_NAME: ci_test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Fetch the latest commit so we get the README updated by unit-test
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests with coverage
        run: pytest tests/integration/ -v --tb=short -m integration --cov=src --cov-report=xml:coverage-integration.xml --junitxml=pytest-integration.xml
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path:./coverage-integration.xml
          junitxml-path: ./pytest-integration.xml
          title: Integration Test Coverage

      - name: Update README — integration test badges and report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          COVERAGE_BADGE: ${{ steps.coverage.outputs.coverageHtml }}
          REPORT_HTML: ${{ steps.coverage.outputs.summaryReport }}
          TESTS: ${{ steps.coverage.outputs.tests }}
          FAILURES: ${{ steps.coverage.outputs.failures }}
          ERRORS: ${{ steps.coverage.outputs.errors }}
          SKIPPED: ${{ steps.coverage.outputs.skipped }}
        run: |
          python - <<'EOF'
          import os, re

          coverage_badge = os.environ['COVERAGE_BADGE']
          report         = os.environ['REPORT_HTML']

          tests    = int(os.environ.get('TESTS',    '0') or 0)
          failures = int(os.environ.get('FAILURES', '0') or 0)
          errors   = int(os.environ.get('ERRORS',   '0') or 0)
          skipped  = int(os.environ.get('SKIPPED',  '0') or 0)
          passed   = tests - failures - errors - skipped

          if tests == 0:
              color, msg = 'lightgrey', 'no%20tests'
          elif failures + errors == 0:
              color, msg = 'brightgreen', f'{passed}%2F{tests}%20passed'
          elif passed / tests >= 0.9:
              color, msg = 'green',       f'{passed}%2F{tests}%20passed'
          elif passed / tests >= 0.75:
              color, msg = 'yellow',      f'{passed}%2F{tests}%20passed'
          else:
              color, msg = 'red',         f'{passed}%2F{tests}%20passed'

          passrate_badge = (
              f'<img src="https://img.shields.io/badge/integration%20tests-{msg}-{color}"'
              f' alt="integration test results">'
          )

          with open('README.md', 'r') as f:
              content = f.read()

          content = re.sub(
              r'<!-- Integration-Badge:Begin -->.*?<!-- Integration-Badge:End -->',
              f'<!-- Integration-Badge:Begin -->\n{coverage_badge}\n<!-- Integration-Badge:End -->',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'<!-- Integration-Passrate-Badge:Begin -->.*?<!-- Integration-Passrate-Badge:End -->',
              f'<!-- Integration-Passrate-Badge:Begin -->\n{passrate_badge}\n<!-- Integration-Passrate-Badge:End -->',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'<!-- Pytest Integration Coverage:Begin -->.*?<!-- Pytest Integration Coverage:End -->',
              f'<!-- Pytest Integration Coverage:Begin -->\n{report}\n<!-- Pytest Integration Coverage:End -->',
              content, flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Commit README (integration)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update integration test badges [skip ci]"
          file_pattern: README.md
