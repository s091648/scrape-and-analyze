name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------------
  # Stage -1: Check & revive staging deployments
  # (staging deployments get manually removed after a PR closes;
  # bring back anything that's REMOVED before migrate/tests run against it)
  # -----------------------------------------------
  check-staging-deployments:
    name: Check & Revive Staging Deployments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: scraper / staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Check each staging service and redeploy REMOVED ones from master
        run: |
          set -uo pipefail
          FAILED=0

          # name -> service ID (must match the deploy-staging-* jobs below)
          declare -A SERVICES=(
            [dashboard-backend]="d20f24b5-6c3f-4732-a9b8-de13486db754"
            [dashboard-frontend]="54f665be-c49e-407e-bf23-e414587b9984"
            [storybook]="3880b0e2-2c02-429f-892c-814a02379e35"
            [scrape-and-analyze]="84433f38-f9e9-4082-bd2e-2af327e3ba69"
            [chatbot-plugin]="e3a28eae-2765-456e-822c-841598fcf1c2"
            [fastembed]="c97be150-c9cc-42d0-a23e-04406573ee93"
            [postgres]="c11d60e9-9bb3-450d-8a78-98f85ba4e890"
            [redis]="ac3aa7a4-c431-4d43-9827-f493dad682df"
            [weekly-report]="0b2a6997-6401-4f6e-91d8-ba1abe34ea46"
            [refresh-metrics]="a8d5fa77-7498-4447-843f-f328d6d595a5"
          )

          # Recursively search the CLI's JSON output for the service's status,
          # since the exact shape of `railway status`/`deployment list --json`
          # isn't officially documented — this is resilient to minor schema
          # differences: `railway deployment list --service X` is already
          # scoped to one service, so a deployment's own `id` field is a
          # *deployment* ID, not the service ID — there's nothing to match
          # against. Just take the first (most recent) `status` string found
          # anywhere in the tree.
          find_status() {
            node -e "
              let data;
              try { data = JSON.parse(process.argv[1]); } catch { console.log('UNKNOWN'); process.exit(0); }
              function find(obj) {
                if (!obj || typeof obj !== 'object') return null;
                if (Array.isArray(obj)) {
                  for (const item of obj) { const r = find(item); if (r) return r; }
                  return null;
                }
                if (typeof obj.status === 'string') return obj.status;
                for (const key of Object.keys(obj)) { const r = find(obj[key]); if (r) return r; }
                return null;
              }
              console.log(find(data) || 'UNKNOWN');
            " "$1"
          }

          for name in "${!SERVICES[@]}"; do
            id="${SERVICES[$name]}"
            echo "::group::Checking $name ($id)"

            CLI_OK=1
            if ! JSON=$(railway deployment list --service "$id" --environment staging --json 2>&1); then
              CLI_OK=0
            fi
            STATUS=$(find_status "$JSON")
            if [ "$STATUS" = "UNKNOWN" ] && [ "$CLI_OK" = "1" ]; then
              if ! JSON=$(railway status --service "$id" --environment staging --json 2>&1); then
                CLI_OK=0
              fi
              STATUS=$(find_status "$JSON")
            fi
            echo "Latest deployment status for $name: $STATUS"

            if [ "$CLI_OK" = "0" ]; then
              echo "::error::Railway CLI call failed for $name — treating as a failure rather than assuming healthy"
              FAILED=1
            elif [ "$STATUS" = "REMOVED" ]; then
              echo "$name is REMOVED — redeploying from master"
              if [ "$name" = "postgres" ]; then
                # Not built from repo source — redeploy the service's last known
                # deployment/image instead of pushing repo contents via `railway up`.
                if ! railway redeploy --service "$id" --environment staging --yes; then
                  echo "::error::Failed to redeploy $name"
                  FAILED=1
                fi
              elif [ "$name" = "chatbot-plugin" ]; then
                if ! (cd chatbot-plugin && railway up --detach --service "$id" --environment staging); then
                  echo "::error::Failed to redeploy $name"
                  FAILED=1
                fi
              else
                if ! railway up --detach --service "$id" --environment staging; then
                  echo "::error::Failed to redeploy $name"
                  FAILED=1
                fi
              fi
            elif [ "$STATUS" = "UNKNOWN" ]; then
              echo "::warning::Could not determine deployment status for $name — skipping redeploy (assumed healthy)."
            else
              echo "$name is healthy ($STATUS) — no action needed"
            fi
            echo "::endgroup::"
          done

          exit $FAILED
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -----------------------------------------------
  # Stage 0: DB Migration (push to master AND PR)
  # -----------------------------------------------
  migrate:
    name: DB Migration
    runs-on: ubuntu-latest
    needs: [check-staging-deployments]
    if: needs.check-staging-deployments.result == 'success'
    timeout-minutes: 10
    environment: scraper / staging

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run alembic upgrade
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # -----------------------------------------------
  # Stage 1: Src Unit Tests (no external dependencies)
  # -----------------------------------------------
  src-unit-test:
    name: Src Unit Tests
    runs-on: ubuntu-latest
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run unit tests with coverage
        run: uv run pytest src/tests/unit/ -v --tb=short --cov=src --cov=shared --cov-report=xml:coverage.xml --junitxml=pytest.xml

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          title: Src Unit Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: |
          TESTS="${{ steps.coverage.outputs.tests }}"
          FAILURES="${{ steps.coverage.outputs.failures }}"
          ERRORS="${{ steps.coverage.outputs.errors }}"
          SKIPPED="${{ steps.coverage.outputs.skipped }}"
          TESTS=${TESTS:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
          if [ "$TESTS" -eq 0 ]; then
            COLOR="lightgrey"; MSG="no tests"
          elif [ $((FAILURES + ERRORS)) -eq 0 ]; then
            COLOR="brightgreen"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 90 ]; then
            COLOR="green"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 75 ]; then
            COLOR="yellow"; MSG="${PASSED}/${TESTS} passed"
          else
            COLOR="red"; MSG="${PASSED}/${TESTS} passed"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update src unit pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: src-unit-passrate.json
          label: src unit tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 1b: Backend Unit Tests (parallel track)
  # -----------------------------------------------
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    timeout-minutes: 15

    env:
      CI_DB_USER: ci
      CI_DB_PASSWORD: ci
      CI_DB_NAME: ci_test

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --group backend --group dev --group observability
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run alembic upgrade for test DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Run backend unit tests with coverage
        run: uv run pytest backend/tests/ -v --tb=short --ignore=backend/tests/integration --cov=backend --cov=shared --cov-report=xml:coverage-backend.xml --junitxml=pytest-backend.xml
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Upload backend-unit coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-backend.xml
          flags: backend-unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage-backend.xml
          junitxml-path: ./pytest-backend.xml
          title: Backend Unit Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: |
          TESTS="${{ steps.coverage.outputs.tests }}"
          FAILURES="${{ steps.coverage.outputs.failures }}"
          ERRORS="${{ steps.coverage.outputs.errors }}"
          SKIPPED="${{ steps.coverage.outputs.skipped }}"
          TESTS=${TESTS:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
          if [ "$TESTS" -eq 0 ]; then
            COLOR="lightgrey"; MSG="no tests"
          elif [ $((FAILURES + ERRORS)) -eq 0 ]; then
            COLOR="brightgreen"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 90 ]; then
            COLOR="green"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 75 ]; then
            COLOR="yellow"; MSG="${PASSED}/${TESTS} passed"
          else
            COLOR="red"; MSG="${PASSED}/${TESTS} passed"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update backend unit pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: backend-unit-passrate.json
          label: backend unit tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 1c: Backend Integration Tests (requires Postgres)
  # -----------------------------------------------
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-unit]
    timeout-minutes: 20

    env:
      CI_DB_USER: ci
      CI_DB_PASSWORD: ci
      CI_DB_NAME: ci_test

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --group backend --group dev --group observability
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run alembic upgrade for test DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Run backend integration tests with coverage
        run: uv run pytest backend/tests/integration/ -v --tb=short -m integration --cov=backend --cov=shared --cov-report=xml:coverage-backend-integration.xml --junitxml=pytest-backend-integration.xml
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
          REDIS_URL: redis://localhost:6379/0

      - name: Upload backend-integration coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-backend-integration.xml
          flags: backend-integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage-backend-integration.xml
          junitxml-path: ./pytest-backend-integration.xml
          title: Backend Integration Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: |
          TESTS="${{ steps.coverage.outputs.tests }}"
          FAILURES="${{ steps.coverage.outputs.failures }}"
          ERRORS="${{ steps.coverage.outputs.errors }}"
          SKIPPED="${{ steps.coverage.outputs.skipped }}"
          TESTS=${TESTS:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
          if [ "$TESTS" -eq 0 ]; then
            COLOR="lightgrey"; MSG="no tests"
          elif [ $((FAILURES + ERRORS)) -eq 0 ]; then
            COLOR="brightgreen"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 90 ]; then
            COLOR="green"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 75 ]; then
            COLOR="yellow"; MSG="${PASSED}/${TESTS} passed"
          else
            COLOR="red"; MSG="${PASSED}/${TESTS} passed"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update backend integration pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: backend-integration-passrate.json
          label: backend integration tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 2: Src Integration Tests (requires Postgres)
  # -----------------------------------------------
  src-integration-test:
    name: Src Integration Tests
    runs-on: ubuntu-latest
    needs: [migrate, src-unit-test]
    if: |
      always() &&
      needs.src-unit-test.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    timeout-minutes: 30

    env:
      CI_DB_USER: ci
      CI_DB_PASSWORD: ci
      CI_DB_NAME: ci_test

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run alembic upgrade for test DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Run integration tests with coverage
        run: uv run pytest src/tests/integration/ -v --tb=short -m integration --cov=src --cov=shared --cov-report=xml:coverage-integration.xml --junitxml=pytest-integration.xml
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-integration.xml
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage-integration.xml
          junitxml-path: ./pytest-integration.xml
          title: Src Integration Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: |
          TESTS="${{ steps.coverage.outputs.tests }}"
          FAILURES="${{ steps.coverage.outputs.failures }}"
          ERRORS="${{ steps.coverage.outputs.errors }}"
          SKIPPED="${{ steps.coverage.outputs.skipped }}"
          TESTS=${TESTS:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
          if [ "$TESTS" -eq 0 ]; then
            COLOR="lightgrey"; MSG="no tests"
          elif [ $((FAILURES + ERRORS)) -eq 0 ]; then
            COLOR="brightgreen"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 90 ]; then
            COLOR="green"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 75 ]; then
            COLOR="yellow"; MSG="${PASSED}/${TESTS} passed"
          else
            COLOR="red"; MSG="${PASSED}/${TESTS} passed"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update src integration pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: src-integration-passrate.json
          label: src integration tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 3a: Frontend Unit Tests (parallel track)
  # -----------------------------------------------
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run vitest with coverage
        run: npm run test:coverage -- --reporter=verbose --reporter=json --outputFile=test-results.json
        continue-on-error: true

      - name: Fix lcov paths for monorepo upload
        run: sed -i 's|SF:|SF:frontend/|g' coverage/lcov.info

      - name: Upload frontend-unit coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend-unit
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Compute pass rate
        id: passrate
        if: always()
        run: |
          PASSED=$(node -e "
            const r = require('./test-results.json');
            console.log(r.numPassedTests ?? 0);
          " 2>/dev/null || echo 0)
          TOTAL=$(node -e "
            const r = require('./test-results.json');
            console.log((r.numPassedTests ?? 0) + (r.numFailedTests ?? 0));
          " 2>/dev/null || echo 0)
          FAILED=$((TOTAL - PASSED))
          if [ "$TOTAL" -eq 0 ]; then
            COLOR="lightgrey"; MSG="no tests"
          elif [ "$FAILED" -eq 0 ]; then
            COLOR="brightgreen"; MSG="${PASSED}/${TOTAL} passed"
          elif [ $((PASSED * 100 / TOTAL)) -ge 90 ]; then
            COLOR="green"; MSG="${PASSED}/${TOTAL} passed"
          elif [ $((PASSED * 100 / TOTAL)) -ge 75 ]; then
            COLOR="yellow"; MSG="${PASSED}/${TOTAL} passed"
          else
            COLOR="red"; MSG="${PASSED}/${TOTAL} passed"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Update frontend unit pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: frontend-unit-passrate.json
          label: frontend unit tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 3b: Frontend E2E Tests (after frontend-unit)
  # -----------------------------------------------
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: frontend-unit
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

      - name: Compute e2e pass rate
        id: passrate
        if: always()
        run: |
          if [ -f playwright-results.xml ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' playwright-results.xml | head -1 || echo 0)
            FAILED=$(grep -oP 'failures="\K[0-9]+' playwright-results.xml | head -1 || echo 0)
            ERRORS=$(grep -oP 'errors="\K[0-9]+' playwright-results.xml | head -1 || echo 0)
            TOTAL=${TOTAL:-0}; FAILED=${FAILED:-0}; ERRORS=${ERRORS:-0}
            PASSED=$((TOTAL - FAILED - ERRORS))
            if [ "$TOTAL" -eq 0 ]; then
              COLOR="lightgrey"; MSG="no tests"
            elif [ $((FAILED + ERRORS)) -eq 0 ]; then
              COLOR="brightgreen"; MSG="${PASSED}/${TOTAL} passed"
            elif [ $((PASSED * 100 / TOTAL)) -ge 90 ]; then
              COLOR="green"; MSG="${PASSED}/${TOTAL} passed"
            else
              COLOR="red"; MSG="${PASSED}/${TOTAL} passed"
            fi
          else
            COLOR="lightgrey"; MSG="no results"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Update frontend e2e pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: frontend-e2e-passrate.json
          label: frontend e2e tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

