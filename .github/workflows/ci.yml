name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------------
  # Stage 1: Unit Tests (no external dependencies)
  # -----------------------------------------------
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --tb=short --cov=src --cov-report=xml:coverage.xml --junitxml=pytest.xml

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          title: Unit Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: |
          TESTS="${{ steps.coverage.outputs.tests }}"
          FAILURES="${{ steps.coverage.outputs.failures }}"
          ERRORS="${{ steps.coverage.outputs.errors }}"
          SKIPPED="${{ steps.coverage.outputs.skipped }}"
          TESTS=${TESTS:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
          if [ "$TESTS" -eq 0 ]; then
            COLOR="lightgrey"; MSG="no tests"
          elif [ $((FAILURES + ERRORS)) -eq 0 ]; then
            COLOR="brightgreen"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 90 ]; then
            COLOR="green"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 75 ]; then
            COLOR="yellow"; MSG="${PASSED}/${TESTS} passed"
          else
            COLOR="red"; MSG="${PASSED}/${TESTS} passed"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update unit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: unit-coverage.json
          label: unit coverage
          message: ${{ steps.coverage.outputs.coverage }}
          color: ${{ steps.coverage.outputs.color }}

      - name: Update unit pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: unit-passrate.json
          label: unit tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 2: Integration Tests (requires Postgres)
  # -----------------------------------------------
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 30

    env:
      CI_DB_USER: ci
      CI_DB_PASSWORD: ci
      CI_DB_NAME: ci_test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --all-groups
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Run integration tests with coverage
        run: pytest tests/integration/ -v --tb=short -m integration --cov=src --cov-report=xml:coverage-integration.xml --junitxml=pytest-integration.xml
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-integration.xml
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-path: ./coverage-integration.xml
          junitxml-path: ./pytest-integration.xml
          title: Integration Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: |
          TESTS="${{ steps.coverage.outputs.tests }}"
          FAILURES="${{ steps.coverage.outputs.failures }}"
          ERRORS="${{ steps.coverage.outputs.errors }}"
          SKIPPED="${{ steps.coverage.outputs.skipped }}"
          TESTS=${TESTS:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
          if [ "$TESTS" -eq 0 ]; then
            COLOR="lightgrey"; MSG="no tests"
          elif [ $((FAILURES + ERRORS)) -eq 0 ]; then
            COLOR="brightgreen"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 90 ]; then
            COLOR="green"; MSG="${PASSED}/${TESTS} passed"
          elif [ $((PASSED * 100 / TESTS)) -ge 75 ]; then
            COLOR="yellow"; MSG="${PASSED}/${TESTS} passed"
          else
            COLOR="red"; MSG="${PASSED}/${TESTS} passed"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Write coverage to job summary
        if: always()
        env:
          REPORT: ${{ steps.coverage.outputs.summaryReport }}
        run: echo "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Update integration pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: integration-passrate.json
          label: integration tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 3a: Frontend Unit Tests (parallel track)
  # -----------------------------------------------
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest with coverage
        run: npm run test:coverage -- --reporter=json --outputFile=test-results.json

      - name: Upload frontend-unit coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend-unit
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Compute pass rate
        id: passrate
        run: |
          PASSED=$(node -e "
            const r = require('./test-results.json');
            console.log(r.numPassedTests ?? 0);
          " 2>/dev/null || echo 0)
          TOTAL=$(node -e "
            const r = require('./test-results.json');
            console.log((r.numPassedTests ?? 0) + (r.numFailedTests ?? 0));
          " 2>/dev/null || echo 0)
          FAILED=$((TOTAL - PASSED))
          if [ "$TOTAL" -eq 0 ]; then
            COLOR="lightgrey"; MSG="no tests"
          elif [ "$FAILED" -eq 0 ]; then
            COLOR="brightgreen"; MSG="${PASSED}/${TOTAL} passed"
          elif [ $((PASSED * 100 / TOTAL)) -ge 90 ]; then
            COLOR="green"; MSG="${PASSED}/${TOTAL} passed"
          elif [ $((PASSED * 100 / TOTAL)) -ge 75 ]; then
            COLOR="yellow"; MSG="${PASSED}/${TOTAL} passed"
          else
            COLOR="red"; MSG="${PASSED}/${TOTAL} passed"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Update frontend unit pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: frontend-unit-passrate.json
          label: frontend unit tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}

  # -----------------------------------------------
  # Stage 3b: Frontend E2E Tests (after frontend-unit)
  # -----------------------------------------------
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: frontend-unit
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Compute e2e pass rate
        id: passrate
        if: always()
        run: |
          if [ -f playwright-results.xml ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' playwright-results.xml | head -1 || echo 0)
            FAILED=$(grep -oP 'failures="\K[0-9]+' playwright-results.xml | head -1 || echo 0)
            ERRORS=$(grep -oP 'errors="\K[0-9]+' playwright-results.xml | head -1 || echo 0)
            TOTAL=${TOTAL:-0}; FAILED=${FAILED:-0}; ERRORS=${ERRORS:-0}
            PASSED=$((TOTAL - FAILED - ERRORS))
            if [ "$TOTAL" -eq 0 ]; then
              COLOR="lightgrey"; MSG="no tests"
            elif [ $((FAILED + ERRORS)) -eq 0 ]; then
              COLOR="brightgreen"; MSG="${PASSED}/${TOTAL} passed"
            elif [ $((PASSED * 100 / TOTAL)) -ge 90 ]; then
              COLOR="green"; MSG="${PASSED}/${TOTAL} passed"
            else
              COLOR="red"; MSG="${PASSED}/${TOTAL} passed"
            fi
          else
            COLOR="lightgrey"; MSG="no results"
          fi
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Update frontend e2e pass rate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: frontend-e2e-passrate.json
          label: frontend e2e tests
          message: ${{ steps.passrate.outputs.msg }}
          color: ${{ steps.passrate.outputs.color }}
