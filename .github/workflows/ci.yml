name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  # -----------------------------------------------
  # Stage 1: Unit Tests (no external dependencies)
  # -----------------------------------------------
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --tb=short --cov=src --cov-report=xml:coverage.xml --junitxml=pytest.xml

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-report: ./coverage.xml
          junitxml-path: ./pytest.xml
          title: Unit Test Coverage

      - name: Update README — unit test badge and report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          BADGE_HTML: ${{ steps.coverage.outputs.coverageHtml }}
          REPORT_HTML: ${{ steps.coverage.outputs.summaryReport }}
        run: |
          python - <<'EOF'
          import os, re

          badge  = os.environ['BADGE_HTML']
          report = os.environ['REPORT_HTML']

          with open('README.md', 'r') as f:
              content = f.read()

          content = re.sub(
              r'<!-- Unit-Badge:Begin -->.*?<!-- Unit-Badge:End -->',
              f'<!-- Unit-Badge:Begin -->\n{badge}\n<!-- Unit-Badge:End -->',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'<!-- Pytest Coverage Comment:Begin -->.*?<!-- Pytest Coverage Comment:End -->',
              f'<!-- Pytest Coverage Comment:Begin -->\n{report}\n<!-- Pytest Coverage Comment:End -->',
              content, flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Commit README (unit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update unit test coverage badge [skip ci]"
          file_pattern: README.md

  # -----------------------------------------------
  # Stage 2: Integration Tests (requires Postgres)
  # -----------------------------------------------
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Fetch the latest commit so we get the README updated by unit-test
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests with coverage
        run: pytest tests/integration/ -v --tb=short -m integration --cov=src --cov-report=xml:coverage-integration.xml --junitxml=pytest-integration.xml
        env:
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Pytest Coverage Comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.6.0
        with:
          pytest-xml-coverage-report: ./coverage-integration.xml
          junitxml-path: ./pytest-integration.xml
          title: Integration Test Coverage

      - name: Update README — integration test badge and report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          BADGE_HTML: ${{ steps.coverage.outputs.coverageHtml }}
          REPORT_HTML: ${{ steps.coverage.outputs.summaryReport }}
        run: |
          python - <<'EOF'
          import os, re

          badge  = os.environ['BADGE_HTML']
          report = os.environ['REPORT_HTML']

          with open('README.md', 'r') as f:
              content = f.read()

          content = re.sub(
              r'<!-- Integration-Badge:Begin -->.*?<!-- Integration-Badge:End -->',
              f'<!-- Integration-Badge:Begin -->\n{badge}\n<!-- Integration-Badge:End -->',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'<!-- Pytest Integration Coverage:Begin -->.*?<!-- Pytest Integration Coverage:End -->',
              f'<!-- Pytest Integration Coverage:Begin -->\n{report}\n<!-- Pytest Integration Coverage:End -->',
              content, flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Commit README (integration)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update integration test coverage badge [skip ci]"
          file_pattern: README.md
