name: Auto-generate VitePress config on PR

on:
  pull_request:
    paths:
      - "specs/**"
      - "site/scripts/generate-config.mjs"

permissions:
  contents: write

jobs:
  autogen:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate VitePress config from specs
        run: node scripts/generate-config.mjs
        working-directory: site

      - name: Commit generated config to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/.vitepress/config.js site/index.md
          git diff --cached --quiet || (git commit -m "🤖 [CHORE] auto-update vitepress config from specs" && git push)
