name: Railway config

# Railway-native IaC (`.railway/railway.ts`) — the Railway half of
# 025-iac-provisioning "Revision 6". STANDALONE, deliberately not folded into the
# reusable `terraform.yml`: it has a different trigger (`paths: .railway/**`), a
# different credential (one Railway PROJECT token per environment, not the
# HCP-token / GitHub-PAT / account-token trio), and a different engine
# (`railwayapp/config@v1` wrapping `railway config plan|apply`, not the Terraform
# CLI). See `plan.md` / `tasks.md` "Revision 6" and `infra/terraform/railway/`'s
# split: Terraform still owns ONLY the GitHub Actions secrets/variables.
#
#   PR touching `.railway/**`   → `railway config plan` for BOTH staging and
#                                 production; each diff posted as a PR comment.
#                                 Also applied to STAGING so the PR's staging
#                                 deployment reflects the change (mirrors
#                                 ci.yml's `deploy-staging-terraform`).
#   `v*` tag pushed             → `railway config apply` to PRODUCTION, from
#                                 release.yml's `railway-config-production` job
#                                 (gated by that workflow's `detect` — a test tag
#                                 not on master never touches production).
#                                 Constitution Principle V: production IaC never
#                                 applies on a bare merge to master.
#
# ── MAINTAINER SETUP (one-time) ──────────────────────────────────────────────
# `railway config` has NO `--environment` flag — the token itself selects the
# environment, so it needs a token BOUND to one env (unlike `secrets.RAILWAY_TOKEN`,
# the project-wide token `railway up` / `railway down --environment` use).
# Create one per environment:
#   Railway dashboard → project `scraper` → Settings → Tokens → New Token →
#   pick the environment → copy.
# Store each as a secret named  RAILWAY_CONFIG_TOKEN  in the matching GitHub
# environment:  `scraper / staging`  and  `scraper / production`
#   (repo → Settings → Environments → <env> → Add secret).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [".railway/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: railway-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # `railway config plan` for BOTH environments — `railway.ts` is ctx-aware, so a
  # change can affect staging and production differently and a reviewer must see
  # each diff. `railwayapp/config@v1` posts/updates one PR comment per run and
  # pins the change set + the environment's configEtag + the `.railway/` git tree
  # into an artifact, so a later apply lands exactly the reviewed change set.
  plan:
    # Fork PRs carry no secrets — skip rather than fail. workflow_dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: scraper / ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_CONFIG_TOKEN }}
          artifact-name: railway-plan-${{ matrix.environment }}

  # Apply the change to STAGING during the PR (not on merge) — mirrors
  # `deploy-staging-terraform`, and sidesteps racing ci.yml's post-merge
  # `close-staging-*` teardown. Staging is ephemeral (revived per-PR, torn down
  # on merge), so a fresh plan+apply here is fine; production's pinned-plan
  # "merge/tag = approval" flow lives in release.yml.
  apply-staging:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: apply (staging)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: scraper / staging
    concurrency:
      group: railway-config-apply-staging-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # No PR-head-pinned artifact to consume from a matrix sibling, so re-plan
      # into a local railway-plan.json, then apply that exact file.
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_CONFIG_TOKEN }}
          comment: false
          artifact-name: railway-plan-staging-apply
      - uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_CONFIG_TOKEN }}
          # v1 is all preserve() so this is a near-no-op; fail loudly rather than
          # silently push a destructive change once v2 starts managing values.
          confirm-destructive: false
