name: Deploy Speckit docs to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: site/node_modules
          key: ${{ runner.os }}-site-${{ hashFiles('site/package.json') }}
          restore-keys: |
            ${{ runner.os }}-site-

      - name: Install dependencies
        run: npm install
        working-directory: site

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Install pylint for pyreverse
        run: pip install pylint

      - name: Generate backend UML (pyreverse)
        run: python scripts/generate_uml.py

      - name: Generate DB schema diagram
        run: python scripts/generate_db_schema.py

      - name: Generate exception catalog
        run: python scripts/generate_exceptions.py

      # Pinned to match uv.lock (the version `make uml-terraform-docs` gets in
      # the job_service container) — python-hcl2 has shipped breaking majors
      # (4→8), so an unpinned install could parse github-ci.tf differently here
      # than locally.
      - name: Install python-hcl2 for Terraform docs
        run: pip install 'python-hcl2==8.1.3'

      - name: Generate Terraform services/variables catalog
        run: python scripts/generate_terraform_docs.py

      # Per-module interface reference (inputs/outputs/requirements) via the
      # official terraform-docs tool — complements the usage catalog above.
      # Output is spliced into site/guide/architecture/terraform-modules.md via
      # VitePress's @include at build time below; the fragment files themselves
      # are gitignored (never committed, never hand-maintained). Same command
      # as `make uml-terraform-modules` (infra/terraform/README.md).
      - name: Generate Terraform module reference (terraform-docs)
        run: |
          mkdir -p site/guide/architecture/terraform-modules
          for m in github-ci-config; do
            docker run --rm -v "${{ github.workspace }}/infra/terraform/github:/terraform-docs:ro" -w /terraform-docs \
              quay.io/terraform-docs/terraform-docs:0.20.0 --config /terraform-docs/.terraform-docs.yml markdown table modules/$m \
              | python3 scripts/wrap_terraform_module_doc.py "$m" \
              > site/guide/architecture/terraform-modules/$m.md
          done

      - name: Install frontend dependencies for madge
        run: npm ci
        working-directory: frontend
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate frontend dependency graph (madge)
        working-directory: frontend
        run: |
          mkdir -p ../site/public/guide/architecture
          npx --yes madge --json --extensions ts,tsx --ts-config tsconfig.json app/ lib/ components/ > ../site/public/guide/architecture/frontend-deps.json

      - name: Generate frontend context graph
        working-directory: frontend
        run: node scripts/generate-frontend-context.mjs
        env:
          OUTPUT_PATH: ${{ github.workspace }}/site/public/guide/architecture/frontend-context.json

      - name: Sync spec content into site/
        run: |
          cp -r specs site/specs
          cp .specify/memory/constitution.md site/constitution.md

      - name: Generate VitePress config
        run: npm run generate
        working-directory: site

      - name: Build VitePress
        run: npm run build
        working-directory: site
        env:
          VITEPRESS_BASE: "${{ steps.pages.outputs.base_path }}/"
          STORYBOOK_URL: "${{ vars.STORYBOOK_URL }}"
          BACKEND_URL: "${{ vars.BACKEND_URL }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
