name: Deploy Speckit docs to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: site/node_modules
          key: ${{ runner.os }}-site-${{ hashFiles('site/package.json') }}
          restore-keys: |
            ${{ runner.os }}-site-

      - name: Install dependencies
        run: npm install
        working-directory: site

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Install pylint for pyreverse
        run: pip install pylint

      - name: Generate backend UML (pyreverse)
        run: python scripts/generate_uml.py

      - name: Install frontend dependencies for madge
        run: npm ci
        working-directory: frontend

      - name: Generate frontend dependency graph (madge)
        working-directory: frontend
        run: |
          mkdir -p ../site/public/guide/architecture
          npx --yes madge --json --extensions ts,tsx --ts-config tsconfig.json app/ lib/ components/ > ../site/public/guide/architecture/frontend-deps.json

      - name: Generate frontend context graph
        working-directory: frontend
        run: node scripts/generate-frontend-context.mjs
        env:
          OUTPUT_PATH: ${{ github.workspace }}/site/public/guide/architecture/frontend-context.json

      - name: Sync spec content into site/
        run: |
          cp -r specs site/specs
          cp .specify/memory/constitution.md site/constitution.md

      - name: Build VitePress
        run: npm run build
        working-directory: site
        env:
          VITEPRESS_BASE: "${{ steps.pages.outputs.base_path }}/"
          STORYBOOK_URL: "${{ vars.STORYBOOK_URL }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
