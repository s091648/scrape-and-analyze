name: Railway config

# Reusable runner for the Railway half of 025-iac-provisioning "Revision 6" —
# `.railway/railway.ts` applied via `railwayapp/config@v1`
# (`railway config plan` / `railway config apply`). ci.yml / release.yml call it
# with `uses:` + two inputs, exactly like the Terraform half's terraform.yml.
#
# STANDALONE from terraform.yml on purpose:
#   - different engine     — Railway's own IaC, not the Terraform CLI
#   - different credential  — secrets.RAILWAY_TOKEN, the environment-scoped Railway
#                            PROJECT token github-ci.tf (module github_ci_env)
#                            already provisions per GitHub Environment. `railway
#                            config` has NO --environment flag, so the token alone
#                            selects the env — hence `environment:` below picks
#                            which one this run targets.
#   - different scope       — reacts to `.railway/**`, not `infra/terraform/**`
#
# Called as a job:
#   uses: ./.github/workflows/railway-config.yml
#   with: { mode: plan|apply, environment: staging|production }
#   secrets: inherit
#
# `mode: apply` always plans first (into a local railway-plan.json) then applies
# exactly that file — a push/tag/reusable-call has no PR-head-pinned plan artifact
# to consume, unlike a direct PR run of railwayapp/config.

on:
  workflow_call:
    inputs:
      mode:
        description: "plan | apply"
        required: true
        type: string
      environment:
        description: "staging | production"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]
      environment:
        description: "staging | production"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

permissions:
  contents: read
  pull-requests: write # railwayapp/config posts/updates the plan comment on PRs
  actions: read # ...and reads back its pinned plan artifact

jobs:
  railway-config:
    name: railway config ${{ inputs.mode }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: scraper / ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v5

      # `railway config` evaluates .railway/railway.ts via Node type-stripping —
      # needs Node >= 22.6 (ubuntu-latest ships 20). Match the railway_cli
      # container (node:24).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # railway.ts does `import "railway/iac"`. railwayapp/config installs the
      # CLI but NOT the `railway` SDK package the import needs — install it at the
      # repo root so the ESM parent-dir walk from .railway/railway.ts resolves it.
      # (The SDK is gutted — "the engine ships in the CLI now" — but still
      # required to satisfy the import; same as the railway_cli container.)
      - name: Install the railway TypeScript SDK
        run: npm install --no-save --no-package-lock railway@latest

      # railway.ts reads secret / ${{...}}-reference values via process.env.X
      # (T6-08c). Rebuild the git-ignored tfvars from the base64 secrets (same
      # source terraform.yml uses) and explode them into $GITHUB_ENV so the
      # railwayapp/config steps below see them. `need()` in railway.ts throws if
      # a var is missing, so a bad materialize fails the plan, not the apply.
      - name: Materialize tfvars + explode into env
        env:
          TF_TFVARS_GITHUB_SHARED: ${{ secrets.TF_TFVARS_GITHUB_SHARED }}
          TF_TFVARS_RAILWAY_SHARED: ${{ secrets.TF_TFVARS_RAILWAY_SHARED }}
          TF_TFVARS_GITHUB_STAGING: ${{ secrets.TF_TFVARS_GITHUB_STAGING }}
          TF_TFVARS_RAILWAY_STAGING: ${{ secrets.TF_TFVARS_RAILWAY_STAGING }}
          TF_TFVARS_GITHUB_PRODUCTION: ${{ secrets.TF_TFVARS_GITHUB_PRODUCTION }}
          TF_TFVARS_RAILWAY_PRODUCTION: ${{ secrets.TF_TFVARS_RAILWAY_PRODUCTION }}
        run: |
          set -euo pipefail
          cd infra/terraform/railway
          printf '%s' "$TF_TFVARS_GITHUB_SHARED"  | base64 -d > secrets/github-shared.tfvars
          printf '%s' "$TF_TFVARS_RAILWAY_SHARED" | base64 -d > secrets/railway-shared.tfvars
          case "${{ inputs.environment }}" in
            staging)
              printf '%s' "$TF_TFVARS_GITHUB_STAGING"  | base64 -d > secrets/github-staging.tfvars
              printf '%s' "$TF_TFVARS_RAILWAY_STAGING" | base64 -d > secrets/railway-staging.tfvars ;;
            production)
              printf '%s' "$TF_TFVARS_GITHUB_PRODUCTION"  | base64 -d > secrets/github-production.tfvars
              printf '%s' "$TF_TFVARS_RAILWAY_PRODUCTION" | base64 -d > secrets/railway-production.tfvars ;;
            *) echo "::error::unknown environment '${{ inputs.environment }}'"; exit 1 ;;
          esac
          cd "$GITHUB_WORKSPACE"
          python scripts/tfvars_to_env.py --env "${{ inputs.environment }}" >> "$GITHUB_ENV"

      # Always runs: on `mode: plan` this is the whole job (and comments on a PR);
      # on `mode: apply` it produces the railway-plan.json the apply step consumes.
      - name: railway config plan (${{ inputs.environment }})
        uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          comment: ${{ inputs.mode == 'plan' && github.event_name == 'pull_request' }}
          artifact-name: railway-plan-${{ inputs.environment }}

      - name: railway config apply (${{ inputs.environment }})
        if: inputs.mode == 'apply'
        uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          # v1 of railway.ts is preserve()-heavy so today this is a near-no-op;
          # fail loudly rather than silently push a destructive change as v2
          # starts managing real values.
          confirm-destructive: false
          artifact-name: railway-plan-${{ inputs.environment }}
