[project]
name = "scrape-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
# 共用核心依賴：scraper 與 backend 都會用到
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "pgvector>=0.3",
    "structlog>=24.0",
    "alembic>=1.13",
    "geoip2>=4.8",
    "pydantic",
    "google-genai"
]

[dependency-groups]
# src/ 爬蟲服務專屬依賴
scraper = [
    "beautifulsoup4",
    "requests",
    "feedparser",
    "anthropic",
    "tenacity",
    "lxml",
    "pymupdf>=1.24",
    "chatbot-plugin-sdk",
    "fastembed>=0.3",
]
# backend/ FastAPI 服務專屬依賴
backend = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-jose[cryptography]>=3.3",
    "python-multipart",
    "email-validator>=2.0",
    "bcrypt>=4.0",
    "httpx",
    "redis>=5.0",
]
# 可觀測性 — scraper 與 backend 共用，prod 才需要
observability = [
    "python-logging-loki>=0.3",
    "sentry-sdk",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation",
]
# 本地開發與測試工具
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "responses",
    "httpx",
    "starlette",
    "pylint>=3.0",
    "graphviz>=0.20",
]

[tool.uv.sources]
chatbot-plugin-sdk = { git = "https://github.com/s091648/chatbot-plugin-sdk.git", tag = "v0.2.0" }

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
]
