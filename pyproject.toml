[project]
name = "scrape-analyzer"
version = "1.6.1"
requires-python = ">=3.11"
# 共用核心依賴：scraper 與 backend 都會用到
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "pgvector>=0.3",
    "structlog>=24.0",
    "alembic>=1.13",
    "geoip2>=4.8",
    "pydantic",
    "google-genai",
    "boto3>=1.34",
    "resend>=2.0",
    # 020-redis-caching-layer: shared/cache/ 被 src/ 與 backend/ 共用，兩邊都需要 —
    # 原本只在 backend group，但 src/Dockerfile 對所有 scraper 服務都是
    # --no-group backend，會導致 ImportError，所以移到這裡確保永遠會被安裝
    "redis>=5.0",
    # 023-article-search follow-up: shared/search_index/tokenizer.py 被 src/ 的
    # RebuildSearchIndexUseCase 與 backend/services/search_service.py（exact-match
    # AND-intersection 查詢時需要用同一套斷詞邏輯切 query）共用，backend/Dockerfile
    # 是 --no-group scraper，同上述 redis 的理由移到這裡確保兩邊都會裝到
    "jieba>=0.42",
    "stopwordsiso>=0.6",
]

[dependency-groups]
# src/ 爬蟲/解析/RAG embedding 專屬依賴 — 只有 worker (main pipeline) 需要，
# weekly-report、refresh-metrics 都不 import 這些。故意跟 llm/http-clients/metrics
# 分開，讓後兩者的 Railway service 不用背爬蟲解析的重量級套件。
scraper = [
    "beautifulsoup4",
    "feedparser",
    "lxml",
    "pymupdf>=1.24",
    "chatbot-plugin-sdk",
    "fastembed>=0.3",
    # 024-async-pipeline-refactor: CollectionPipeline's async DB session
    # (get_async_sessionmaker()) imports asyncpg directly for
    # create_async_engine("postgresql+asyncpg://..."). Already a transitive
    # dependency via chatbot-plugin-sdk's AsyncPgBackend, but declared here
    # explicitly since this pipeline's own code now imports it too.
    "asyncpg>=0.29",
    # 024-async-pipeline-refactor: asyncpg (unlike the old sync psycopg2
    # driver) requires a native datetime for TIMESTAMP WITH TIME ZONE bind
    # params and raises DataError on a raw string — surfaced a pre-existing
    # bug where every scraper passed a client's raw published-date string
    # straight through to ScrapedArticle.published_at (typed datetime) without
    # parsing it. BaseScraper._parse_published_at() now normalizes it via
    # dateutil, already a transitive dependency (feedparser) but declared
    # explicitly since scraper code now imports it directly too.
    "python-dateutil>=2.9",
]
# LLM provider chain 共用依賴 — worker(analyze/translate) 與 weekly-report
# (summary/translate/image) 都會呼叫 src.bootstrap.build_llm_service()，
# 其內部無條件 import ClaudeProvider（anthropic）、tenacity 重試、
# HuggingFace 作為 multimodal provider 選項之一。refresh-metrics 不需要，
# 它完全不碰 LLM。
llm = [
    "anthropic",
    "tenacity",
    "huggingface-hub>=0.24",
    # 024-async-pipeline-refactor: AsyncOpenRouterProvider replaces requests.post
    # with httpx.AsyncClient. Previously only declared in backend/dev groups.
    "httpx",
    # 021-ssr-public-pages: both weekly-report image providers (Gemini Imagen,
    # HuggingFace) route their output through image_encoding.encode_as_webp, whose
    # module-level `from PIL import Image` runs as soon as build_weekly_pipeline()
    # imports a provider. weekly-report's UV_GROUP is "llm http-clients" — it does
    # NOT install the `scraper` group, so it never got pillow transitively via
    # fastembed. Declared here explicitly so the weekly-report service has it.
    "pillow>=10.0",
]
# 外部 HTTP client 共用依賴 — worker 的 scrape http client、
# refresh-metrics 的 OpenAlex/Semantic Scholar client、
# weekly-report 的 Telegram notifier 都直接用 requests。
http-clients = [
    "requests",
]
# metric 擷取（JsonPathMetricExtractor）專屬依賴 — 只有 refresh-metrics 需要；
# 爬蟲時的 opportunistic metric free-seed 會繞過這層抽象，不需要 jmespath。
metrics = [
    "jmespath>=1.0",
]
# backend/ FastAPI 服務專屬依賴
backend = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-jose[cryptography]>=3.3",
    "python-multipart",
    "email-validator>=2.0",
    "bcrypt>=4.0",
    "httpx",
    # 023-article-search follow-up: GET /search's dense/sparse query embedding reuses the
    # same provider classes (GeminiDenseProvider, EndpointProvider) that src/'s RAG
    # ingestion pipeline already uses to embed articles — only this way is the query
    # vector guaranteed to land in the same space as the stored article vectors. No
    # extras needed: `gemini` extra's google-genai is already a root-level dependency
    # above, and EndpointProvider only needs httpx (already in this group).
    "chatbot-plugin-sdk",
]
# fastembed/ FastAPI 服務專屬依賴 — fastembed>=0.3 在此重複宣告一次（scraper group
# 已有一份，src/ 的 in-process embedding 路徑用），因為 fastembed/ 服務不該背整個
# scraper group（beautifulsoup4/feedparser/pymupdf 等跟它無關的爬蟲解析套件）。
fastembed-service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "fastembed>=0.3",
]
# 可觀測性 — scraper 與 backend 共用，prod 才需要
observability = [
    "python-logging-loki>=0.3",
    "sentry-sdk",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-httpx",
]
# 本地開發與測試工具
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "responses",
    "httpx",
    "starlette",
    "pylint>=3.0",
    "graphviz>=0.20",
    "python-hcl2>=4.3",
]

[tool.uv.sources]
chatbot-plugin-sdk = { git = "https://github.com/s091648/chatbot-plugin-sdk.git", tag = "v1.3.0" }

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
]
